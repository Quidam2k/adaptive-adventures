    h += `<div class="sr-moment">${linkText(sr.moment)}</div>`;
    if (sr.narrativeHook) h += `<div class="sr-hook">${linkText(sr.narrativeHook)}</div>`;
    if (sr.dmNote) h += `<div class="sr-dm-note">${linkText(sr.dmNote)}</div>`;
    h += `</div>`;
  });
  h += `</div></details>`;
  return h;
}

// Tactical Notes — key:value pairs rendered as DM-only cards, also markable.
// Not kept in play mode. Shared by renderLocation, renderWBtWScene and
// renderTriggerScene.
function renderTacticalNotes(id, adpt) {
  if (!adpt || !adpt.tacticalNotes) return '';
  let h = `<details><summary>Tactical Breakdown <span class="adapt-badge">Adapted</span></summary><div class="section-body">`;
  for (const [tKey, val] of Object.entries(adpt.tacticalNotes)) {
    const label = tKey.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const mkey = `tac:${id}:${tKey}`;
    h += `<div class="tactical-card markable" data-mark-key="${esc(mkey)}"><h4>${esc(label)}</h4><p>${linkText(val)}</p></div>`;
  }
  h += `</div></details>`;
  return h;
}

// Session State — per-scene pickup status from the adaptation. Shared by
// renderLocation and renderWBtWScene (location- or scene-keyed).
function renderSessionState(adpt) {
  if (!adpt || !adpt.sessionState) return '';
  const ss = adpt.sessionState;
  const ssPreview = ss.status ? snip(ss.status, 90) : '';
  let h = `<details open${PLAY_KEEP}>${summaryWithPreview('Session State', { adapted: true, preview: ssPreview })}<div class="section-body">`;
  if (ss.status) h += `<div class="kv"><span class="k">Status:</span> ${linkText(ss.status)}</div>`;
  if (ss.enteredVia) h += `<div class="kv"><span class="k">Entered via:</span> ${linkText(ss.enteredVia)}</div>`;
  if (ss.narrative) h += `<div style="margin-top:6px">${paraText(ss.narrative)}</div>`;
  if (ss.keyPoints && ss.keyPoints.length) {
    h += `<div class="sub-label" style="color:var(--text-dim);margin-top:8px">Key Points</div><ul class="plain">`;
    for (const kp of ss.keyPoints) h += `<li>${linkText(kp)}</li>`;
    h += `</ul>`;
  }
  if (ss.notes && ss.notes.length) {
    for (const n of ss.notes) h += `<div class="kv" style="margin-top:8px"><span class="k">${esc(n.label)}:</span> ${linkText(n.text)}</div>`;
  }
  if (ss.resolvedElements && ss.resolvedElements.length) {
    h += `<div class="sub-label" style="color:var(--text-dim);margin-top:8px">Resolved</div>`;
    h += `<ul class="plain">`;
    for (const r of ss.resolvedElements) h += `<li>${linkText(r)}</li>`;
    h += `</ul>`;
  }
  if (ss.unresolvedElements && ss.unresolvedElements.length) {
    h += `<div class="sub-label" style="color:var(--orange);margin-top:8px">Unresolved</div>`;
    h += `<ul class="plain">`;
    for (const u of ss.unresolvedElements) h += `<li>${linkText(u)}</li>`;
    h += `</ul>`;
  }
  if (ss.pendingElements && ss.pendingElements.length) {
    h += `<div class="sub-label" style="color:var(--orange);margin-top:8px">Pending</div>`;
    h += `<ul class="plain">`;
    for (const p of ss.pendingElements) h += `<li>${linkText(p)}</li>`;
    h += `</ul>`;
  }
  if (ss.npcStatus) {
    h += `<div class="sub-label" style="color:var(--text-dim);margin-top:8px">NPC Status</div>`;
    for (const [npcKey, npcStatus] of Object.entries(ss.npcStatus)) {
      h += `<div class="kv"><span class="k">${esc(npcKey)}:</span> ${linkText(npcStatus)}</div>`;
    }
  }
  if (ss.cliffhangerResolution) h += `<div class="dm-note" style="margin-top:8px"><strong>Cliffhanger:</strong> ${linkText(ss.cliffhangerResolution)}</div>`;
  if (ss.dmNote) h += `<div class="dm-note" style="margin-top:8px">${paraText(ss.dmNote)}</div>`;
  h += `</div></details>`;
  return h;
}

// Table Rulings — locked rulings from the append-only rulings log whose
// sceneRefs include this view (or one of the scenes rendered on it). Shared by
// renderLocation and renderTriggerScene. Rulings matter at the table, so the
// block stays visible in play mode.
function renderTableRulings(ids) {
  if (!adaptation || !adaptation.rulings || !adaptation.rulings.length) return '';
  const idSet = new Set(Array.isArray(ids) ? ids : [ids]);
  const hits = adaptation.rulings.filter(r => (r.sceneRefs || []).some(ref => idSet.has(ref)));
  if (!hits.length) return '';
  const preview = hits.length === 1 ? snip(hits[0].ruling, 90) : `${hits.length} locked rulings`;
  let h = `<details${PLAY_KEEP}>${summaryWithPreview('Table Rulings', { adapted: true, preview })}<div class="section-body">`;
  hits.forEach(r => {
    h += `<div class="kv" style="margin-bottom:8px"><span class="k">${esc(r.date)}:</span> ${linkText(r.ruling)}</div>`;
  });
  h += `</div></details>`;
  return h;
}

// Passive Revelations — inline thresholds + PC shortcuts. Shared by
// renderLocation and renderTriggerScene.
function renderPassiveRevelations(id, adpt) {
  if (!adpt || !adpt.passiveRevelations || !Object.keys(adpt.passiveRevelations).length) return '';
  let h = `<details${PLAY_KEEP}><summary>Passive Revelations <span class="adapt-badge">Adapted</span></summary><div class="section-body">`;
  for (const [topic, block] of Object.entries(adpt.passiveRevelations)) {
    const label = topic.replace(/_/g, ' ').replace(/([A-Z])/g, ' $1').replace(/\b\w/g, c => c.toUpperCase()).trim();
    h += `<div class="pr-block"><div class="pr-block-title">${esc(label)}</div>`;
    if (block.partyAgnostic && block.partyAgnostic.length) {
      block.partyAgnostic.forEach((pa, i) => {
        const key = `pr-pa:${id}:${topic}:${i}`;
        h += `<div class="pr-item markable" data-mark-key="${esc(key)}"><span class="pr-threshold">${esc(pa.threshold)}</span><div class="pr-reveals">${linkText(pa.reveals)}</div></div>`;
      });
    }
    if (block.namedPcAccess && block.namedPcAccess.length) {
      block.namedPcAccess.forEach((pc, i) => {
        const key = `pr-pc:${id}:${topic}:${i}`;
        h += `<div class="pr-item markable" data-mark-key="${esc(key)}" style="border-left-color:var(--teal)"><span class="pr-pc-name">${esc(pc.pc)}</span><div class="pr-reveals">${linkText(pc.access)}</div></div>`;
      });
    }
    h += `</div>`;
  }
  h += `</div></details>`;
  return h;
}

// Combat Briefing — hazards + creatures + synergies + pre-empt rulings.
// Shared by renderLocation and renderTriggerScene (union of both old copies).
function renderCombatBriefing(id, adpt) {
  if (!adpt || !adpt.combatBriefing) return '';
  const cb = adpt.combatBriefing;
  let h = `<details${PLAY_KEEP}><summary>Combat Briefing <span class="adapt-badge">Adapted</span></summary><div class="section-body">`;
  if (cb.sceneSummary) h += paraText(cb.sceneSummary, 'font-size:14px;margin-bottom:10px');
  if (cb.sceneLevelHazards && cb.sceneLevelHazards.length) {
    h += `<div class="sub-label" style="color:var(--text-dim);margin-top:8px">Hazards</div>`;
    cb.sceneLevelHazards.forEach((hz, i) => {
      const key = `hazard:${id}:${i}`;
      h += `<div class="cb-hazard markable" data-mark-key="${esc(key)}">`;
      h += `<h4>${esc(hz.name)}</h4>`;
      if (hz.detail) h += `<div class="cb-detail">${linkText(hz.detail)}</div>`;
      if (hz.pcImpact) h += `<div class="cb-impact">${linkText(hz.pcImpact)}</div>`;
      if (hz.ruling) h += `<div class="dm-note" style="margin-top:6px"><strong>Ruling:</strong> ${linkText(hz.ruling)}</div>`;
      if (hz.recommendedRuling) h += `<div class="dm-note" style="margin-top:6px"><strong>Recommended ruling:</strong> ${linkText(hz.recommendedRuling)}</div>`;
      if (hz.holyWaterSourcing) h += `<div class="cb-impact">${linkText(hz.holyWaterSourcing)}</div>`;
      h += `</div>`;
    });
  }
  if (cb.creatures && Object.keys(cb.creatures).length) {
    h += `<div class="sub-label" style="color:var(--text-dim);margin-top:12px">Creatures</div>`;
    for (const [creatureKey, cr] of Object.entries(cb.creatures)) {
      h += `<div class="cb-creature">`;
      h += `<h4>${esc(creatureKey)}${cr.count ? ` <span style="font-weight:400;color:var(--text-dim);font-size:12px">× ${esc(String(cr.count))}</span>` : ''}</h4>`;
      if (cr.stats) h += `<div class="cb-stats">${esc(cr.stats)}</div>`;
      if (cr.notes) h += `<div class="cb-stats" style="color:var(--text)">${linkText(cr.notes)}</div>`;
      if (cr.signatureMechanics) {
        h += `<div class="cb-sub-title">Signature Mechanics</div>`;
        if (Array.isArray(cr.signatureMechanics)) {
          h += `<ul class="plain">`;
          for (const m of cr.signatureMechanics) h += `<li>${linkText(m)}</li>`;
          h += `</ul>`;
        } else {
          h += `<p style="font-size:13px">${linkText(cr.signatureMechanics)}</p>`;
        }
      }
      if (cr.damageProfile) {
        h += `<div class="cb-sub-title">Damage Profile</div>`;
        if (cr.damageProfile.immunities) h += `<div class="kv" style="font-size:13px"><span class="k">Immune:</span> ${cr.damageProfile.immunities.join(', ')}</div>`;
        if (cr.damageProfile.resistances) h += `<div class="kv" style="font-size:13px"><span class="k">Resist:</span> ${cr.damageProfile.resistances.join(', ')}</div>`;
        if (cr.damageProfile.vulnerabilities && cr.damageProfile.vulnerabilities.length) h += `<div class="kv" style="font-size:13px"><span class="k">Vulnerable:</span> ${cr.damageProfile.vulnerabilities.join(', ')}</div>`;
        if (cr.damageProfile.notes) h += `<div class="cb-impact">${linkText(cr.damageProfile.notes)}</div>`;
        if (cr.damageProfile.notesFromSession) h += `<div class="cb-impact"><strong>From session:</strong> ${linkText(cr.damageProfile.notesFromSession)}</div>`;
      }
      if (cr.conditionProfile) {
        h += `<div class="cb-sub-title">Condition Profile</div>`;
        if (cr.conditionProfile.immunities) h += `<div class="kv" style="font-size:13px"><span class="k">Immune:</span> ${cr.conditionProfile.immunities.join(', ')}</div>`;
        if (cr.conditionProfile.vulnerable) h += `<div class="kv" style="font-size:13px"><span class="k">Vulnerable:</span> ${cr.conditionProfile.vulnerable.join(', ')}</div>`;
        if (cr.conditionProfile.notes) h += `<div class="cb-impact">${linkText(cr.conditionProfile.notes)}</div>`;
        if (cr.conditionProfile.notesFromSession) h += `<div class="cb-impact"><strong>From session:</strong> ${linkText(cr.conditionProfile.notesFromSession)}</div>`;
      }
      if (cr.rulesAmbiguitiesToPreEmpt && cr.rulesAmbiguitiesToPreEmpt.length) {
        h += `<div class="cb-sub-title">Pre-Empt Rulings</div>`;
        cr.rulesAmbiguitiesToPreEmpt.forEach((amb, i) => {
          const key = `ambig:${id}:${creatureKey}:${i}`;
          h += `<div class="cb-ambig markable" data-mark-key="${esc(key)}">${linkText(amb)}</div>`;
        });
      }
      if (cr.killPriority) h += `<div class="kv" style="margin-top:6px;font-size:13px"><span class="k">Kill priority:</span> ${linkText(cr.killPriority)}</div>`;
      if (cr.tacticalNotes) {
        h += `<div class="cb-sub-title">Tactical Notes</div>`;
        if (Array.isArray(cr.tacticalNotes)) {
          h += `<ul class="plain">`;
          for (const t of cr.tacticalNotes) h += `<li>${linkText(t)}</li>`;
          h += `</ul>`;
        } else {
          h += `<p style="font-size:13px">${linkText(cr.tacticalNotes)}</p>`;
        }
      }
      if (cr.tacticalNote) h += `<div class="cb-impact">${linkText(cr.tacticalNote)}</div>`;
      if (cr.combatRole) h += `<div class="cb-impact"><strong>Combat role:</strong> ${linkText(cr.combatRole)}</div>`;
      if (cr.recognition) h += `<div class="cb-impact"><strong>Recognition:</strong> ${linkText(cr.recognition)}</div>`;
      h += `</div>`;
    }
  }
  if (cb.creatureSynergies && cb.creatureSynergies.length) {
    h += `<div class="sub-label" style="color:var(--text-dim);margin-top:12px">Creature Synergies</div>`;
    cb.creatureSynergies.forEach((syn, i) => {
      const key = `synergy:${id}:${i}`;
      h += `<div class="cb-synergy markable" data-mark-key="${esc(key)}">${linkText(syn)}</div>`;
    });
  }
  h += `</div></details>`;
  return h;
}

// ===================== RENDER: REFERENCE PAGES =====================
function renderReference(view) {
  switch (view) {
    case 'ref-pickup': return renderSessionPickup();
    case 'ref-lore': return renderLore();
    case 'ref-features': return renderFeatures();
    case 'ref-undead': return renderUndead();
    case 'ref-telepathy': return renderTelepathy();
    case 'ref-hoard': return renderHoard();
    case 'ref-bestiary': return renderBestiary();
    case 'ref-dc': return renderDC();
    case 'ref-callbacks': return renderCallbacks();
    case 'ref-voice': return renderVoice();
    case 'ref-rulings': return renderRulingsLog();
    case 'ref-unplaced': return renderUnplacedScenes();
    default: return '<p>Unknown reference section.</p>';
  }
}

// The "Tonight" landing view: what matters at the next session, from the
// adaptation's continuityBriefing. Action-oriented sections open by default;
// recap/reference sections collapsed with preview chips. Unknown briefing
// fields render through a generic fallback so update passes can add fields
// without renderer edits.
function renderSessionPickup() {
  const cb = adaptation && adaptation.continuityBriefing;
  const at = partyAt();
  let h = `<div class="room-header"><div class="room-key">${cb && cb.lastSessionDate ? 'Last played ' + esc(cb.lastSessionDate) : 'Session pickup'}</div><h1>Tonight</h1><div class="room-meta">Where the table stopped, and what comes next.</div>`;
  if (at) h += `<div class="party-here"><span class="lab">&#9670; Party at</span><span>${placeKey(at) ? `<span class="conn-id">${esc(placeKey(at))}</span> ` : ''}${placeLink(at, placeName(at))}${placeMeta[at] && placeMeta[at].improvised ? ' <span class="muted">(improvised)</span>' : ''}</span></div>`;
  h += `</div>`;
  if (!cb) return h + '<p>No continuity briefing on this adaptation.</p>';
  const handled = new Set(['lastSessionDate']);
  const section = (key, label, body, opts) => {
    handled.add(key);
    if (!body) return '';
    opts = opts || {};
    return `<details${opts.open ? ' open' : ''}>${summaryWithPreview(label, { preview: opts.preview })}<div class="section-body">${body}</div></details>`;
  };
  const list = arr => `<ul class="plain">${arr.map(i => `<li>${linkText(i)}</li>`).join('')}</ul>`;
  const listPreview = arr => `${arr.length} item${arr.length === 1 ? '' : 's'} · ${snip(arr[0], 60)}`;

  // Action-oriented: open
  h += section('whereTheyAre', 'Where They Are', cb.whereTheyAre ? paraText(cb.whereTheyAre) : '', { open: true });
  h += section('whatTheyAreDoing', "What They're Doing", cb.whatTheyAreDoing ? paraText(cb.whatTheyAreDoing) : '', { open: true });
  h += section('mostLikelyNextActions', 'Most Likely Next Actions',
    (cb.mostLikelyNextActions && cb.mostLikelyNextActions.length) ? list(cb.mostLikelyNextActions) : '', { open: true });
  h += section('prepFocus', 'Prep Focus', cb.prepFocus ? paraText(cb.prepFocus) : '', { open: true });

  // Combat state: collapsed, status line as preview
  handled.add('currentCombatState');
  if (cb.currentCombatState) {
    const ccs = cb.currentCombatState;
    h += `<details>${summaryWithPreview('Current Combat State', { preview: snip(ccs.status || ccs.note || '', 90) })}<div class="section-body">`;
    if (ccs.note) h += `<div class="dm-note" style="border-top:none;padding-top:0;margin-bottom:6px">${esc(ccs.note)}</div>`;
    for (const [k, v] of Object.entries(ccs)) {
      if (k === 'note' || typeof v !== 'string') continue;
      h += `<div style="margin-top:8px"><div class="k" style="margin-bottom:2px">${esc(humanizeKey(k))}</div>${paraText(v)}</div>`;
    }
    h += `</div></details>`;
  }

  // Recap / reference: collapsed with previews
  h += section('lastSessionSummary', 'Last Session Recap',
    cb.lastSessionSummary ? paraText(cb.lastSessionSummary) : '', { preview: snip(cb.lastSessionSummary, 90) });
  h += section('whatTheyKnowNow', 'What They Know Now',
    (cb.whatTheyKnowNow && cb.whatTheyKnowNow.length) ? list(cb.whatTheyKnowNow) : '',
    { preview: cb.whatTheyKnowNow && cb.whatTheyKnowNow.length ? listPreview(cb.whatTheyKnowNow) : '' });
  h += section('geographyReconciliation', 'Map / Layout Note',
    cb.geographyReconciliation ? paraText(cb.geographyReconciliation) : '', { preview: snip(cb.geographyReconciliation, 90) });
  handled.add('openThreadsForDM');
  if (cb.openThreadsForDM && cb.openThreadsForDM.length) {
    h += `<details>${summaryWithPreview('Open Threads (DM-only)', { preview: listPreview(cb.openThreadsForDM) })}<div class="section-body">`;
    for (const t of cb.openThreadsForDM) h += `<div class="secret"><div class="secret-label">Open Thread</div>${linkText(t)}</div>`;
    h += `</div></details>`;
  }

  // Generic fallback for briefing fields this renderer doesn't know about
  for (const [k, v] of Object.entries(cb)) {
    if (handled.has(k) || v === null || v === undefined) continue;
    const label = humanizeKey(k);
    if (typeof v === 'string') {
      h += `<details>${summaryWithPreview(label, { preview: snip(v, 90) })}<div class="section-body">${paraText(v)}</div></details>`;
    } else if (Array.isArray(v)) {
      const items = v.filter(x => typeof x === 'string');
      if (items.length) h += `<details>${summaryWithPreview(label, { preview: listPreview(items) })}<div class="section-body">${list(items)}</div></details>`;
    } else if (typeof v === 'object') {
      const rows = Object.entries(v).filter(([, vv]) => typeof vv === 'string');
      if (rows.length) {
        h += `<details>${summaryWithPreview(label, { preview: `${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}` })}<div class="section-body">`;
        for (const [kk, vv] of rows) h += `<div style="margin-top:8px"><div class="k" style="margin-bottom:2px">${esc(humanizeKey(kk))}</div>${paraText(vv)}</div>`;
        h += `</div></details>`;
      }
    }
  }
  return h;
}

function renderLore() {
  let h = `<div class="room-header"><h1>Lore & Hooks</h1></div>`;
  if (source.lore) {
    h += `<details><summary>Background</summary><div class="section-body"><p>${linkText(source.lore.background)}</p>`;

  }
  if (source.entering) {
    h += `<details><summary>Entering Shadowkeep</summary><div class="section-body"><p>${esc(source.entering.description)}</p></div></details>`;
  }
  if (adaptation && adaptation.campaignIntegration) {
    const ci = adaptation.campaignIntegration;
    h += `<details><summary>Campaign Integration <span class="adapt-badge">Adapted</span></summary><div class="section-body">`;

    if (ci.toneDirective) h += `<div class="kv"><span class="k">Tone:</span> ${linkText(ci.toneDirective)}</div>`;
    if (ci.hookStatus) {
      h += `<div style="margin-top:10px"><strong>Hook Status:</strong></div>`;
      for (const [hk, status] of Object.entries(ci.hookStatus)) {
        h += `<div class="kv" style="padding-left:12px"><span class="k">${esc(hk)}:</span> ${linkText(status)}</div>`;

    for (const hook of source.hooks) {
      h += `<div class="poi-card"><h4>${esc(hook.name)}</h4><p>${linkText(hook.description)}</p>`;
      if (hook.reward) h += `<div class="kv"><span class="k">Reward:</span> ${esc(hook.reward)}</div>`;

    }

    h += `<div class="kv"><span class="k">Condition:</span> ${esc(source.resting.condition)}</div>`;
    h += `<div class="kv"><span class="k">Interruption:</span> ${esc(source.resting.interruption)}</div>`;
    h += `</div></details>`;
  }
  return h;
}

function renderFeatures() {
  let h = `<div class="room-header"><h1>Common Features</h1></div>`;
  const cf = source.commonFeatures;
  // Shadowkeep: array of {id, name, summary, detail}. WBtW: object keyed by id
  // with {name, text} values — normalize to the array shape.
  const feats = !cf ? []
    : Array.isArray(cf) ? cf
    : Object.entries(cf)
        .filter(([k, v]) => !k.startsWith('_') && v && typeof v === 'object')
        .map(([k, v]) => ({ id: k, name: v.name || k, summary: v.summary, detail: v.detail != null ? v.detail : v.text }));
  for (const f of feats) {
    h += `<div class="poi-card"><h4>${esc(f.name)}</h4>`;
    if (f.summary) h += `<div class="poi-type">${esc(f.summary)}</div>`;
    if (f.detail) h += `<p style="font-size:13px">${esc(f.detail)}</p></div>`;
    else h += `</div>`;
  }
  return h;
}

function renderUndead() {
  let h = `<div class="room-header"><h1>Undead Behavior</h1></div>`;

  if (ub) {
    h += `<div class="kv"><span class="k">Corporeal:</span> ${esc(ub.corporeal)}</div>`;

    h += `<div class="kv" style="margin-top:6px"><span class="k">Unconscious creatures:</span> ${esc(ub.unconsciousCreatures)}</div>`;

      for (const s of ub.capturedInfo.secrets) h += `<li>${esc(s)}</li>`;

function renderTelepathy() {

        h += `<div class="taunt-target">Tone: ${esc(t.tone.replace(/_/g, ' '))}</div>`;

  }
  return h;
}

function renderHoard() {
  let h = `<div class="room-header"><h1>Count Rhodar's Treasure Hoard</h1></div>`;
  const hd = source.hoard;
  if (!hd) return h + '<p>No hoard data.</p>';
  h += `<div class="kv"><span class="k">Location:</span> ${esc(hd.location)}</div>`;
  h += `<p style="font-size:13px;margin:6px 0">${esc(hd.description)}</p>`;

  if (hd.magicItems && hd.magicItems.length) {
    h += `<details><summary>Magic Items</summary><div class="section-body">`;
    for (const item of hd.magicItems) {
      h += `<div class="poi-card"><h4>${esc(item.name)}</h4>`;
      h += `<div class="poi-type">${esc(item.rarity || '')}${item.attunement ? ' | ' + esc(item.attunement) : ''}${item.location ? ' | Found: ' + esc(item.location) : ''}</div>`;
      if (item.description) h += `<p style="font-size:13px">${esc(item.description)}</p>`;
      if (item.benefits) {
        h += `<ul class="plain">`;
        for (const b of item.benefits) h += `<li>${esc(b)}</li>`;
        h += `</ul>`;
      }
      if (item.sentience) {
        h += `<div class="dm-note" style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px"><strong>Sentience:</strong> ${esc(item.sentience.alignment)}, INT ${item.sentience.scores.INT} WIS ${item.sentience.scores.WIS} CHA ${item.sentience.scores.CHA}. ${esc(item.sentience.communication)}. ${esc(item.sentience.personality)}</div>`;
      }
      if (item.shadowFormDetails) h += `<div style="font-size:12px;color:var(--text-dim);margin-top:4px">${esc(item.shadowFormDetails)}</div>`;
      if (item.note) h += `<div style="font-size:12px;color:var(--text-dim);margin-top:4px">${esc(item.note)}</div>`;
      h += `</div>`;
    }
    h += `</div></details>`;
  }

  if (hd.consumables && hd.consumables.length) {
    h += `<details><summary>Consumables</summary><div class="section-body">`;
    for (const c of hd.consumables) h += `<div class="treasure-item">${c.count}x ${esc(c.name)}</div>`;
    h += `</div></details>`;
  }

  if (hd.specialItems && hd.specialItems.length) {
    h += `<details><summary>Special Items</summary><div class="section-body">`;
    for (const item of hd.specialItems) {
      h += `<div class="poi-card"><h4>${esc(item.name)}</h4>`;
      if (item.description) h += `<p style="font-size:13px">${esc(item.description)}</p>`;
      if (item.effect) h += `<div style="font-size:13px;color:var(--orange);margin-top:4px">${esc(item.effect)}</div>`;
      h += `</div>`;
    }
    h += `</div></details>`;
  }

  if (hd.mundaneWealth && hd.mundaneWealth.length) {
    h += `<details><summary>Mundane Wealth</summary><div class="section-body">`;
    for (const m of hd.mundaneWealth) h += `<div class="treasure-item">${m.count}x ${esc(m.name)} (${esc(m.value)})</div>`;
    h += `</div></details>`;
  }

  if (hd.coins) {
    h += `<details><summary>Coins</summary><div class="section-body">`;
    h += `<div class="treasure-item">`;
    const parts = [];
    if (hd.coins.pp) parts.push(hd.coins.pp.toLocaleString() + ' pp');
    if (hd.coins.gp) parts.push(hd.coins.gp.toLocaleString() + ' gp');
    if (hd.coins.sp) parts.push(hd.coins.sp.toLocaleString() + ' sp');
    if (hd.coins.cp) parts.push(hd.coins.cp.toLocaleString() + ' cp');
    h += parts.join(' | ');
    h += `</div></div></details>`;
  }
  return h;
}

function renderBestiary() {

  if (!source.bestiary) return h + '<p>No bestiary data.</p>';
  for (const [id, cr] of Object.entries(source.bestiary)) {
    h += renderCreatureCard(cr);
  }
  return h;
}

function fmtMod(v) {
  const m = Math.floor((v - 10) / 2);
  return (m >= 0 ? '+' : '') + m;
}

// Shared stat-block body used by both the full (bestiary) and inline (right
// panel) creature cards. Markup is identical; CSS scales the compact variant.
function statBody(cr) {
  let h = `<div class="stat-sub">${esc(cr.size || '')} ${esc(cr.type || '')}${cr.alignment ? ', ' + esc(cr.alignment) : ''}${cr.cr ? ' · CR ' + cr.cr : ''}</div>`;
  h += `<hr class="stat-divider">`;
  if (cr.ac) h += `<div class="stat-row"><span class="stat-label">AC</span> ${cr.ac}${cr.acType ? ' (' + esc(cr.acType) + ')' : ''}</div>`;
  if (cr.hp) h += `<div class="stat-row"><span class="stat-label">HP</span> ${typeof cr.hp === 'string' ? esc(cr.hp) : cr.hp}${cr.hpFormula ? ' (' + esc(cr.hpFormula) + ')' : ''}</div>`;
  if (cr.speed) {
    const spd = Object.entries(cr.speed).filter(([k,v]) => v && k !== 'hover').map(([k,v]) => k === 'walk' ? v + ' ft.' : k + ' ' + v + ' ft.').join(', ');
    h += `<div class="stat-row"><span class="stat-label">Speed</span> ${esc(spd)}${cr.speed.hover ? ' (hover)' : ''}</div>`;
  }
  if (cr.abilities) {
    h += `<hr class="stat-divider"><div class="ability-scores">`;
    for (const [ab, val] of Object.entries(cr.abilities)) {
      h += `<div><div class="ab-name">${ab}</div><div class="ab-val">${val}</div><div class="ab-mod">(${fmtMod(val)})</div></div>`;
    }
    h += `</div>`;
  }
  h += `<hr class="stat-divider">`;
  if (cr.savingThrows) h += `<div class="stat-row"><span class="stat-label">Saves</span> ${Object.entries(cr.savingThrows).map(([k,v]) => k + ' +' + v).join(', ')}</div>`;
  if (cr.skills) h += `<div class="stat-row"><span class="stat-label">Skills</span> ${Object.entries(cr.skills).map(([k,v]) => k + ' +' + v).join(', ')}</div>`;
  if (cr.damageResistances) h += `<div class="stat-row"><span class="stat-label">Resist</span> ${cr.damageResistances.join(', ')}</div>`;
  if (cr.damageImmunities) h += `<div class="stat-row"><span class="stat-label">Immune</span> ${cr.damageImmunities.join(', ')}</div>`;
  if (cr.conditionImmunities) h += `<div class="stat-row"><span class="stat-label">Cond. Immune</span> ${cr.conditionImmunities.join(', ')}</div>`;
  if (cr.senses) h += `<div class="stat-row"><span class="stat-label">Senses</span> ${Object.entries(cr.senses).map(([k,v]) => k.replace(/([A-Z])/g, ' $1').trim() + ' ' + v + (typeof v === 'number' ? ' ft.' : '')).join(', ')}</div>`;
  if (cr.languages) h += `<div class="stat-row"><span class="stat-label">Languages</span> ${cr.languages.join(', ')}</div>`;
  if (cr.traits && cr.traits.length) {
    h += `<hr class="stat-divider">`;
    for (const t of cr.traits) h += `<div class="stat-row"><span class="stat-label">${esc(t.name)}.</span> ${esc(t.description)}</div>`;
  }
  if (cr.actions && cr.actions.length) {
    h += `<div class="stat-sec">Actions</div>`;
    for (const a of cr.actions) {
      h += `<div class="stat-row"><span class="stat-label">${esc(a.name)}.</span> `;
      if (a.type) h += `<em>${esc(a.type)}:</em> `;
      if (a.toHit) h += `+${a.toHit} to hit, `;
      if (a.reach) h += `reach ${a.reach} ft., `;
      if (a.range) h += `range ${a.range} ft., `;
      if (a.damage) h += `${esc(a.damage)}. `;
      if (a.effect) h += esc(a.effect);
      if (a.description) h += esc(a.description);
      if (a.prerequisite) h += ` <em>(${esc(a.prerequisite)})</em>`;
      if (a.note) h += ` <span class="muted">${esc(a.note)}</span>`;
      h += `</div>`;
    }
  }
  if (cr.bonusActions && cr.bonusActions.length) {
    h += `<div class="stat-sec">Bonus Actions</div>`;
    for (const a of cr.bonusActions) h += `<div class="stat-row"><span class="stat-label">${esc(a.name)}.</span> ${esc(a.description)}</div>`;
  }
  if (cr.reactions && cr.reactions.length) {
    h += `<div class="stat-sec">Reactions</div>`;
    for (const r of cr.reactions) {
      h += `<div class="stat-row"><span class="stat-label">${esc(r.name)}.</span> `;
      if (r.trigger) h += `<em>Trigger: ${esc(r.trigger)}.</em> `;
      h += esc(r.description) + `</div>`;
    }
  }
  if (cr.villainActions && cr.villainActions.length) {
    h += `<div class="stat-sec">Villain Actions</div>`;
    for (const a of cr.villainActions) h += `<div class="stat-row"><span class="stat-label">${esc(a.name)}.</span> ${esc(a.description)}</div>`;
  }
  if (cr.spells) {
    h += `<div class="stat-sec">Spellcasting</div>`;
    if (cr.spells.saveDC) h += `<div class="stat-row">Spell save DC ${cr.spells.saveDC}${cr.spells.ability ? ' (' + esc(cr.spells.ability) + ')' : ''}</div>`;
    if (cr.spells.atWill) h += `<div class="stat-row"><span class="stat-label">At will:</span> ${cr.spells.atWill.join(', ')}</div>`;
    if (cr.spells.perDay3) h += `<div class="stat-row"><span class="stat-label">3/day:</span> ${cr.spells.perDay3.join(', ')}</div>`;
    if (cr.spells.perDay1) h += `<div class="stat-row"><span class="stat-label">1/day:</span> ${cr.spells.perDay1.join(', ')}</div>`;
  }
  if (cr.features && cr.features.length) {
    h += `<div class="stat-sec">Features</div>`;
    for (const f of cr.features) h += `<div class="stat-row"><span class="stat-label">${esc(f.name)} (Lv${f.level}).</span> ${esc(f.description)}</div>`;
  }
  if (cr.note) h += `<div class="dm-note">${esc(cr.note)}</div>`;
  return h;
}

// Single creature card renderer. mode: 'full' (bestiary page, collapsible
// classic PHB block) or 'inline' (right panel, compact).
function renderCreatureCard(cr, mode) {
  if (mode === 'inline') return `<div class="rp-stat"><h3>${esc(cr.name)}</h3>` + statBody(cr) + `</div>`;
  return `<details><summary class="stat-summary">${esc(cr.name)} <span class="stat-cr">${esc(cr.cr ? 'CR ' + cr.cr : '')}</span></summary><div class="stat-block"><h3>${esc(cr.name)}</h3>` + statBody(cr) + `</div></details>`;
}

function renderDC() {
  if (!adaptation || !adaptation.dcAdjustments) return '<p>No DC adjustment data.</p>';
  const dc = adaptation.dcAdjustments;
  let h = `<div class="room-header"><h1>DC Adjustments</h1></div>`;
  h += `<div class="kv" style="margin-bottom:12px"><span class="k">Policy:</span> ${esc(dc.policy)}</div>`;
  if (dc.notes) h += `<p style="font-size:13px;color:var(--text-dim);margin-bottom:12px">${esc(dc.notes)}</p>`;
  if (dc.autoSuccesses) {
    h += `<details><summary>Auto-Successes</summary><div class="section-body">`;
    for (const [key, checks] of Object.entries(dc.autoSuccesses)) {
      const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      h += `<div style="margin-bottom:8px"><strong style="color:var(--teal)">${esc(label)}</strong>`;
      h += `<ul class="plain">`;
      for (const c of checks) h += `<li>${esc(c)}</li>`;
      h += `</ul></div>`;
    }
    h += `</div></details>`;
  }
  return h;
}

// Rulings Log — chronological, append-only record of locked table rulings from
// the adaptation's rulings layer. Scene-scoped copies render on their scenes
// via renderTableRulings.
function renderRulingsLog() {
  if (!adaptation || !adaptation.rulings || !adaptation.rulings.length) return '<p>No table rulings recorded.</p>';
  let h = `<div class="room-header"><h1>Rulings Log</h1><div class="room-meta">Locked table rulings, oldest first. Append-only — update passes add entries but never rewrite them.</div></div>`;
  adaptation.rulings.forEach(r => {
    h += `<div class="callback-card">`;
    h += `<h4>${esc(r.date)}</h4>`;
    h += `<p style="font-size:13px">${linkText(r.ruling)}</p>`;
    if (r.sceneRefs && r.sceneRefs.length) {
      h += `<div class="callback-option">Applies to: ${linkText(r.sceneRefs.join(', '))}</div>`;
    }
    h += `</div>`;
  });
  return h;
}

// Scenes with no location view, rendered in full so their source content and
// adaptation blocks stay reachable, plus adaptation keys that match nothing.
function renderUnplacedScenes() {
  const { scenes, orphans } = unplacedScenes();
  let h = '';
  if (scenes.length) h += `<div class="room-header"><h1>Unplaced Scenes</h1><div class="room-meta">Scenes no location links to (travel, random encounters, transitions). Run them wherever they happen.</div></div>`;
  for (const [sid, scene] of scenes) {
    h += renderWBtWScene(sid, scene);
    h += renderTableRulings([sid]);
  }
  if (orphans.length) {
    h += `<div class="room-header"${scenes.length ? ' style="margin-top:28px"' : ''}><h1>Orphaned Adaptation Entries</h1><div class="room-meta">These adaptation keys match no location, event or source scene, so nothing else renders them. Check the key for a typo or a missing source scene.</div></div>`;
    for (const sid of orphans) {
      h += renderWBtWScene(sid, { type: 'orphan', title: sid, summary: `No source scene "${sid}" — adaptation data only.` });
      h += renderTableRulings([sid]);
    }
  }
  return h;
}

function renderCallbacks() {
  if (!adaptation || !adaptation.campaignCallbacks) return '<p>No campaign callback data.</p>';
  let h = `<div class="room-header"><h1>Campaign Integration & Callbacks</h1></div>`;
  for (const [key, cb] of Object.entries(adaptation.campaignCallbacks)) {
    h += `<div class="callback-card">`;
    h += `<h4>${esc(key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()))}</h4>`;
    h += `<p style="font-size:13px">${linkText(cb.description)}</p>`;
    const optList = cb.options || cb.suggestions;
    if (optList && optList.length) {
      for (const opt of optList) {
        if (typeof opt === 'string') {
          h += `<div class="callback-option">${esc(opt)}</div>`;
        } else {
          h += `<div class="callback-option"><strong>${esc(opt.id || '')}</strong> ${esc(opt.description || '')}`;
          if (opt.pros) h += `<br><span style="color:var(--green);font-size:12px">Pros: ${esc(opt.pros)}</span>`;
          if (opt.cons) h += `<br><span style="color:var(--red);font-size:12px">Cons: ${esc(opt.cons)}</span>`;
          h += `</div>`;
        }
      }
    }
    if (cb.dmNote) h += `<div class="callback-dm-note">${esc(cb.dmNote)}</div>`;
    h += `</div>`;
  }
  return h;
}

function renderVoice() {
  if (!adaptation || !adaptation.narrationVoice) return '<p>No narration voice data.</p>';
  const nv = adaptation.narrationVoice;
  let h = `<div class="room-header"><h1>Narration Voice</h1></div>`;
  h += `<div class="kv"><span class="k">Tone:</span> ${esc(nv.tone)}</div>`;
  h += `<p style="font-size:13px;margin:8px 0">${esc(nv.description)}</p>`;
  if (nv.characterVoices) {
    h += `<details><summary>Character Voices</summary><div class="section-body">`;
    for (const [name, desc] of Object.entries(nv.characterVoices)) {
      h += `<div class="voice-card"><div class="voice-name">${esc(name.charAt(0).toUpperCase() + name.slice(1))}</div><div class="voice-desc">${esc(desc)}</div></div>`;
    }
    h += `</div></details>`;
  }
  return h;
}

// ===================== COMPONENT RENDERERS =====================
function renderConnections(connections, label) {
  if (!connections || !Object.keys(connections).length) return '';
  let h = `<div class="sub-label" style="color:var(--text-dim);margin-bottom:4px">${esc(label)}</div>`;
  h += `<div class="connections">`;
  for (const [targetId, info] of Object.entries(connections)) {
    const key = placeKey(targetId);
    const party = partyAt() === targetId ? ' <span class="sb-party">&#9670; party</span>' : '';
    h += `<button class="conn-btn" data-target="${esc(targetId)}" style="flex-direction:column;align-items:flex-start;gap:2px">`;
    h += `<div>${key ? `<span class="conn-id">${esc(key)}</span> ` : ''}<span class="conn-name">${esc(placeName(targetId))}</span>${info.via ? `<span class="conn-via"> ${esc(info.via)}</span>` : ''}${party}</div>`;
    if (info.note) h += `<div class="conn-note">${esc(namesText(info.note))}</div>`;
    h += `</button>`;
  }
  h += `</div>`;
  return h;
}

function renderEncounter(enc) {
  let h = `<div class="encounter-card">`;
  h += `<h4>${esc(enc.name)}</h4>`;
  if (enc.creatures && enc.creatures.length) {
    h += `<ul class="creature-list">`;
    for (const c of enc.creatures) {
      const name = c.name ? c.name : (source.bestiary[c.id] ? source.bestiary[c.id].name : c.id);
      h += `<li>${c.count}x ${esc(name)}${c.position ? ' (' + esc(c.position) + ')' : ''}</li>`;
    }
    h += `</ul>`;
  }
  if (enc.detection) {
    h += `<div class="check-entry"><span class="check-dc">DC ${enc.detection.dc} ${esc(enc.detection.skill)}</span>: ${esc(enc.detection.result)}</div>`;
  }
  if (enc.trigger) h += `<div class="kv"><span class="k">Trigger:</span> ${esc(enc.trigger)}</div>`;
  if (enc.tactics) h += `<div class="tactics">${linkText(enc.tactics)}</div>`;
  if (enc.ritualClock) {
    const rc = enc.ritualClock;
    h += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">`;
    h += `<div class="kv"><span class="k">Ritual:</span> ${esc(rc.description)}</div>`;
    if (rc.identifyDC) h += `<div class="check-entry"><span class="check-dc">DC ${rc.identifyDC} ${esc(rc.identifySkill || '')}</span>: ${esc(rc.identifyResult || '')}</div>`;
    if (rc.failureCondition) h += `<div class="kv" style="color:var(--red)"><span class="k">Failure:</span> ${esc(rc.failureCondition)}</div>`;
    if (rc.failureResult) h += `<div class="kv" style="color:var(--red)"><span class="k">Result:</span> ${esc(rc.failureResult)}</div>`;
    if (rc.disruptMethods) {
      h += `<div class="kv"><span class="k">Disrupt:</span></div><ul class="plain">`;
      for (const m of rc.disruptMethods) h += `<li>${esc(m)}</li>`;
      h += `</ul>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}

function renderHazard(haz) {
  let h = `<div class="hazard-card"><h4>${esc(haz.name)}</h4>`;
  h += `<p style="font-size:13px">${esc(haz.description)}</p>`;
  if (haz.identifyDC) h += `<div class="check-entry"><span class="check-dc">DC ${haz.identifyDC} ${esc(haz.identifySkill || '')}</span>${haz.identifyAlt ? ' or ' + esc(haz.identifyAlt) : ''}</div>`;
  if (haz.damage) h += `<div class="kv"><span class="k">Damage:</span> ${esc(haz.damage)}</div>`;
  if (haz.trigger) h += `<div class="kv"><span class="k">Trigger:</span> ${esc(haz.trigger)}</div>`;
  if (haz.antiFlying) h += `<div class="kv"><span class="k">Anti-flying:</span> ${esc(haz.antiFlying)}</div>`;
  if (haz.saveDC) h += `<div class="kv"><span class="k">Save DC:</span> ${haz.saveDC}${haz.saveAbility ? ' ' + esc(haz.saveAbility) : ''}</div>`;
  if (haz.failEffect) h += `<div class="kv"><span class="k">Fail:</span> ${esc(haz.failEffect)}</div>`;
  if (haz.successEffect) h += `<div class="kv"><span class="k">Success:</span> ${esc(haz.successEffect)}</div>`;
  if (haz.language) h += `<div class="kv"><span class="k">Language:</span> ${esc(haz.language)}</div>`;
  if (haz.counterLevel) h += `<div class="kv"><span class="k">Counter:</span> Light from spell level ${haz.counterLevel}+ persists</div>`;
  if (haz.glyphs) {
    h += `<div style="margin-top:6px"><strong style="color:var(--orange);font-size:12px">Glyphs:</strong></div>`;
    for (const g of haz.glyphs) {
      h += `<div class="check-entry">${esc(g.position)}: <strong>${esc(g.spell)}</strong> (level ${g.level})</div>`;

function renderPOI(poi) {
  let h = `<div class="poi-card"><h4>${esc(poi.name)}</h4>`;
  if (poi.type) h += `<div class="poi-type">${esc(poi.type)}</div>`;
  if (poi.description) h += `<p style="font-size:13px">${linkText(poi.description)}</p>`;
  if (poi.leadsTo) h += `<div class="kv"><span class="k">Leads to:</span> ${placeLink(poi.leadsTo, placeName(poi.leadsTo))}</div>`;
  if (poi.interaction) h += `<div class="kv"><span class="k">Interaction:</span> ${linkText(poi.interaction)}</div>`;
  if (poi.motivation) h += `<div class="kv"><span class="k">Motivation:</span> ${linkText(poi.motivation)}</div>`;
  if (poi.offers && poi.offers.length) {
    h += `<div class="kv"><span class="k">Offers:</span></div><ul class="plain">`;
    for (const o of poi.offers) h += `<li>${esc(o)}</li>`;
    h += `</ul>`;
  }
  if (poi.ifAttacked) h += `<div class="kv"><span class="k">If attacked:</span> ${esc(poi.ifAttacked)}</div>`;
  if (poi.checks && poi.checks.length) {
    for (const ck of poi.checks) {
      h += `<div class="check-entry"><span class="check-dc">DC ${ck.dc} ${esc(ck.skill)}</span>: ${esc(ck.success)}`;
      if (ck.successBy5) h += `<br><span class="check-dc">Beat by 5+:</span> ${esc(ck.successBy5)}`;
      if (ck.synergy) h += `<br><span class="muted">${esc(ck.synergy)}</span>`;
      h += `</div>`;
    }
  }
  if (poi.consequence) {
    if (poi.consequence.triggered) h += `<div class="kv" style="color:var(--red)"><span class="k">If triggered:</span> ${esc(poi.consequence.triggered)}</div>`;
    if (poi.consequence.avoided) h += `<div class="kv" style="color:var(--green)"><span class="k">If avoided:</span> ${esc(poi.consequence.avoided)}</div>`;
  }
  if (poi.redTaxMechanic) {
    const rt = poi.redTaxMechanic;
    h += `<div style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px">`;
    h += `<div class="kv"><span class="k">Red Tax (if willing):</span> ${esc(rt.ifWilling)}</div>`;
    if (rt.bypass) {
      h += `<div class="kv"><span class="k">Bypass:</span></div>`;
      for (const b of rt.bypass) {
        h += `<div class="check-entry">${esc(b.method)}${b.dc ? ': DC ' + b.dc + ' ' + esc(b.skill || '') : ''}</div>`;
      }
    }
    h += `</div>`;
  }
  if (poi.hookNote) h += `<div class="dm-note">${esc(poi.hookNote)}</div>`;
  if (poi.item) h += `<div class="kv"><span class="k">Item:</span> ${esc(poi.item)}</div>`;
  if (poi.durability) h += `<div class="kv"><span class="k">Durability:</span> AC ${poi.durability.ac}, ${poi.durability.hp} HP (immune: ${poi.durability.immunities.join(', ')})</div>`;
  if (poi.destroyMethod) h += `<div class="kv"><span class="k">Destroy:</span> ${esc(poi.destroyMethod)}</div>`;
  if (poi.rhodarPresent) h += `<div class="kv" style="color:var(--red)"><span class="k">If Rhodar was defeated:</span> ${esc(poi.rhodarPresent)}</div>`;
  if (poi.unlocks) h += `<div class="kv"><span class="k">Unlocks:</span> ${poi.unlocks.join(', ')}</div>`;
  h += `</div>`;
  return h;
}

// ===================== RIGHT PANEL =====================
function updateRightPanel(view) {
  const panel = document.getElementById('right-panel');
  const main = document.getElementById('main');
  const loc = source && source.locations[view];
  if (!loc || !source.bestiary) {
    panel.classList.remove('visible');
    main.style.marginRight = '';
    return;
  }

  const creatureIds = new Set();
  if (loc.encounters) {
    for (const enc of loc.encounters) {
      if (enc.creatures) for (const c of enc.creatures) {
        if (c.id && source.bestiary[c.id]) creatureIds.add(c.id);
      }
    }
  }
  if (loc.pointsOfInterest) {
    for (const poi of Object.values(loc.pointsOfInterest)) {
      if (poi.creature && source.bestiary[poi.creature]) creatureIds.add(poi.creature);
    }
  }

  if (!creatureIds.size) {
    panel.classList.remove('visible');
    main.style.marginRight = '';
    return;
  }

  let h = `<div class="rp-title">Creatures Here</div>`;
  for (const id of creatureIds) h += renderCreatureCard(source.bestiary[id], 'inline');
  panel.innerHTML = h;
  panel.classList.add('visible');
  main.style.marginRight = '280px';
}

// ===================== PLACES: keys, names, improvised places, party =====================
// Locations show book-style keys ("12·2", "V3", "D1") and clean names instead
// of raw ids. Improvised places (state layer `improvisedLocations`) are rooms
// the table made that the source doesn't have; each hangs under its nearest
// source location and takes its key plus a letter ("12·1a"). `partyAt` (state
// layer) names where the party is: a source location or an improvised id.
let placeMeta = {};
let sceneHome = {};   // source scene id -> the location page that renders it
function improvisedLocations() { return (adaptation && adaptation.improvisedLocations) || {}; }
function isImprovised(id) { return Object.prototype.hasOwnProperty.call(improvisedLocations(), id); }
function partyAt() {
  const p = adaptation && adaptation.partyAt;
  return p && (source.locations[p] || isImprovised(p)) ? p : null;
}
function buildPlaceMeta() {
  placeMeta = {};
  const perLevel = {};
  for (const [id, loc] of Object.entries(source.locations)) {
    if (!loc || typeof loc !== 'object' || !loc.name) continue;
    let name = loc.name, key = '', group = '';
    const prefixed = name.match(/^([A-Z]{1,3}\d+[a-z]?)\.\s+(.+)$/);           // "D1. Channel"
    const level = name.match(/\(Level (\d+)\)\s*$/) || id.match(/^L_l(\d+)_/);  // "(Level 12)" / L_l12_…
    if (/^[A-Z]{1,3}\d+[a-z]?$/.test(id)) key = id;                             // V3, T2 are book keys already
    else if (prefixed) { key = prefixed[1]; name = prefixed[2]; }
    else if (level) {
      group = `Level ${level[1]}`;
      perLevel[group] = (perLevel[group] || 0) + 1;
      key = `${level[1]}·${perLevel[group]}`;
      name = name.replace(/\s*\(Level \d+\)\s*$/, '');
    }
    placeMeta[id] = { key, name, group, summary: loc.summary || '' };
  }
  sceneHome = {};
  for (const id of Object.keys(placeMeta)) {
    for (const sid of locSceneIds(source.locations[id])) if (!sceneHome[sid]) sceneHome[sid] = id;
  }
  const letters = {};
  for (const [id, p] of Object.entries(improvisedLocations())) {
    const parent = placeMeta[p.parent];
    letters[p.parent] = (letters[p.parent] || 0) + 1;
    const derived = parent && parent.key ? parent.key + String.fromCharCode(96 + letters[p.parent]) : '';
    placeMeta[id] = { key: p.key || derived, name: p.name || id, group: parent ? parent.group : '',
      summary: p.summary || '', improvised: true, parent: p.parent };
  }
}
function placeName(id) { return placeMeta[id] ? placeMeta[id].name : getLocationName(id); }
function placeKey(id) { return placeMeta[id] ? placeMeta[id].key : ''; }

// A navigable mention of a place. Short ids that are book keys (V3) keep the
// key, so "V3 (War Room)" still reads right; long ids show the place's name.
function placeLink(id, label) {
  const asKey = !label && placeKey(id) === id;
  const text = label || (asKey ? id : placeName(id));
  return `<button class="loc-link${asKey ? ' is-key' : ''}" data-view="${esc(id)}">${esc(text)}</button>`;
}

// Every id prose can mention: places (source + improvised), trigger events,
// and source scenes (which render under the room in sceneHome).
function mentionPattern() {
  if (!source || !source.locations) return null;
  const triggerIds = source.triggerScenes ? source.triggerScenes.map(t => t.id) : [];
  const sceneIds = source.scenes ? Object.keys(source.scenes) : [];
  const allIds = [...Object.keys(placeMeta), ...triggerIds, ...sceneIds];
  if (!allIds.length) return null;
  return new RegExp(`\\b(${allIds.map(id => id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})\\b`, 'g');
}
function sceneTitle(id) {
  const sc = source.scenes && source.scenes[id];
  return (sc && sc.title) || id;
}

function linkText(str) {
  if (str === null || str === undefined) return '';
  const s = esc(str);
  const pattern = mentionPattern();
  if (!pattern) return s;
  return s.replace(pattern, id => {
    if (!(source.scenes && source.scenes[id]) || placeMeta[id]) return placeLink(id);
    return sceneHome[id] ? placeLink(sceneHome[id], sceneTitle(id)) : esc(sceneTitle(id));   // a scene: its title, linking to its room
  });
}

// Plain-text version for previews and other unlinked text: ids become names.
function namesText(str) {
  if (str === null || str === undefined) return '';
  const pattern = mentionPattern();
  if (!pattern) return String(str);
  return String(str).replace(pattern, id => (source.scenes && source.scenes[id] && !placeMeta[id])
    ? sceneTitle(id) : (placeKey(id) === id ? id : placeName(id)));
}

// "◆ Party here" under a page title; on a parent room, points at the improvised
// place the party is in.
function partyLine(id) {
  const at = partyAt();
  if (!at) return '';
  if (at === id) return `<div class="party-here"><span class="lab">&#9670; Party here</span><span>${esc(snip((adaptation.continuityBriefing && adaptation.continuityBriefing.whatTheyAreDoing) || '', 160))}</span></div>`;
  if (placeMeta[at] && placeMeta[at].parent === id) return `<div class="party-here"><span class="lab">&#9670; Party nearby</span><span>${placeLink(at, placeName(at))}: ${esc(placeMeta[at].summary)}</span></div>`;
  return '';
}

// Exits from a room, plus the improvised places the table made under it.
function exitsFor(id, connections) {
  const out = Object.assign({}, connections || {});
  for (const [iid, p] of Object.entries(improvisedLocations())) {
    if (p.parent === id && !out[iid]) out[iid] = { via: 'improvised', note: p.summary ? snip(p.summary, 110) : '' };
  }
  return out;
}

// An improvised place's page: same section language as a source room.
function renderImprovised(id) {
  const p = improvisedLocations()[id];
  const m = placeMeta[id];
  let h = `<div class="room-header"><div class="room-key">${esc([m.key, m.group, 'improvised'].filter(Boolean).join(' · '))}</div>`;
  h += `<h1>${esc(m.name)}</h1>`;
  if (p.summary) h += `<div class="room-meta">${esc(p.summary)}</div>`;
  h += `${partyLine(id)}</div>`;
  if (source.locations[p.parent]) h += `<div class="improv-note">Made at the table: the adventure doesn't have this place. It sits under ${placeLink(p.parent, placeName(p.parent))}.</div>`;
  h += renderSessionState(p);
  const ra = Array.isArray(p.readAloud) ? p.readAloud : (p.readAloud ? [p.readAloud] : []);
  if (ra.length) {
    h += `<details open${PLAY_KEEP}>${summaryWithPreview('Read Aloud', { preview: snip(ra[0], 90) })}<div class="section-body">`;
    for (const r of ra) h += `<div class="read-aloud">${esc(r)}</div>`;
    h += `</div></details>`;
  }
  if (p.creatures && p.creatures.length) {
    h += `<details open${PLAY_KEEP}>${summaryWithPreview('Creatures', {})}<div class="section-body">`;
    for (const c of p.creatures) {
      const cr = typeof c === 'string' ? { name: c } : c;
      h += `<div class="stat-block"><h3>${esc(cr.name)}</h3>${cr.note ? `<div class="stat-row">${linkText(cr.note)}</div>` : ''}</div>`;
    }
    h += `</div></details>`;
  }
  h += renderTableRulings([id]);
  h += renderConnections(exitsFor(id, Object.assign(p.parent && source.locations[p.parent] ? { [p.parent]: { via: 'back' } } : {}, p.connections || {})), 'Exits');
  return h;
}

// ===================== RUNNING HEAD: back + breadcrumb + search =====================
function viewLabel(view) {
  if (!view) return '';
  if (view === 'ref-pickup') return 'Tonight';
  if (placeMeta[view]) return placeName(view);
  const ts = source.triggerScenes && source.triggerScenes.find(t => t.id === view);
  if (ts) return ts.name;
  const ref = referencePages().find(([id]) => id === view);
  return ref ? ref[1] : view;
}
function renderRunHead(view) {
  const st = history.state || {};
  const back = st.depth > 0 && st.prev
    ? `<button class="rh-back" onclick="history.back()" title="Back (Alt+Left)">&larr; ${esc(viewLabel(st.prev))}</button>`
    : '';
  const crumbs = [esc(source.meta.title)];
  const m = placeMeta[view];
  if (m) {
    if (m.group) crumbs.push(esc(m.group));
    if (m.improvised && placeMeta[m.parent]) crumbs.push(`<button class="crumb-link" data-view="${esc(m.parent)}">${esc(placeName(m.parent))}</button>`);
  } else if (source.triggerScenes && source.triggerScenes.some(t => t.id === view)) {
    crumbs.push('Events');
  } else if (view !== 'ref-pickup') {
    crumbs.push('Reference');
  }
  crumbs.push(`<b>${esc(viewLabel(view))}</b>`);
  return `<div class="run-head">${back}<span class="crumbs">${crumbs.join(' &middot; ')}</span>`
    + `<button class="rh-seek" onclick="openPalette()">Find a room, creature, ruling<kbd>Ctrl K</kbd></button></div>`;
}

// ===================== PLACE PREVIEWS + LINK CLICKS =====================
// Hover or keyboard focus on a place link shows its key, name and summary.
// On touch the first tap previews and a second tap on the same link goes there.
let tipEl = null, tipArmed = null, lastPointer = 'mouse';
function showTip(el, touch) {
  const id = el.dataset.view;
  const m = placeMeta[id];
  if (!m) return;
  if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'place-tip'; document.body.appendChild(tipEl); }
  tipEl.innerHTML = (m.key || m.improvised ? `<div class="tip-key">${esc([m.key, m.improvised ? 'improvised' : ''].filter(Boolean).join(' · '))}</div>` : '')
    + `<div class="tip-name">${esc(m.name)}${partyAt() === id ? ' <span class="sb-party">&#9670; party</span>' : ''}</div>`
    + (m.summary ? `<div class="tip-sum">${esc(snip(namesText(m.summary), 200))}</div>` : '')
    + (touch ? `<div class="tip-hint">Tap again to open</div>` : '');
  tipEl.classList.add('on');
  const r = el.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  const left = Math.max(8, Math.min(r.left, window.innerWidth - tw - 8));
  const top = r.bottom + 6 + th > window.innerHeight ? r.top - th - 6 : r.bottom + 6;
  tipEl.style.left = left + 'px';
  tipEl.style.top = Math.max(8, top) + 'px';
}
function hideTip() { if (tipEl) tipEl.classList.remove('on'); tipArmed = null; }
document.addEventListener('pointerdown', (e) => { lastPointer = e.pointerType || 'mouse'; }, true);
document.addEventListener('mouseover', (e) => {
  if (lastPointer === 'touch') return;
  const el = e.target.closest('.loc-link[data-view]');
  if (el) showTip(el);
});
document.addEventListener('mouseout', (e) => {
  const el = e.target.closest('.loc-link[data-view]');
  if (el && !el.contains(e.relatedTarget) && tipArmed !== el) hideTip();
});
document.addEventListener('focusin', (e) => {
  const el = e.target.closest('.loc-link[data-view]');
  if (el && el.matches(':focus-visible')) showTip(el);
});
document.addEventListener('focusout', (e) => { if (e.target.closest('.loc-link[data-view]')) hideTip(); });
document.addEventListener('scroll', () => { if (!tipArmed) hideTip(); }, true);
document.addEventListener('click', (e) => {
  const link = e.target.closest('.loc-link[data-view], .crumb-link[data-view]');
  if (!link) {
    if (tipArmed) hideTip();
    return;
  }
  e.preventDefault();
  if (lastPointer === 'touch' && link.classList.contains('loc-link') && tipArmed !== link) {
    showTip(link, true);
    tipArmed = link;
    return;
  }
  hideTip();
  navigate(link.dataset.view);
});

// Render a (possibly multi-paragraph) string as separate <p> blocks, splitting
// on blank lines. Single-paragraph strings render as one <p>, so this is a safe
// drop-in for linkText anywhere text can pile up. Pass an optional inline style
// applied to every paragraph.
function paraText(str, style) {
  if (str === null || str === undefined || str === '') return '';
  const sty = style ? ` style="${style}"` : '';
  return String(str).split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
    .map(p => `<p${sty}>${linkText(p)}</p>`).join('');
}

// Humanize a camelCase or snake_case key into a label
// ("nextSessionOpener" -> "Next Session Opener", "wraith3_stunned" -> "Wraith3 Stunned").
function humanizeKey(k) {
  return String(k).replace(/_/g, ' ').replace(/([A-Z])/g, ' $1')
    .replace(/\s+/g, ' ').trim().replace(/^./, c => c.toUpperCase());
}

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Truncate text for use as a preview snippet in a <summary> chip.
function snip(str, n) {
  if (!str) return '';
  const t = String(str).replace(/\s+/g, ' ').trim();
  return t.length <= n ? t : t.slice(0, n - 1).trimEnd() + '…';
}

// Build a <summary> with a label, optional adapt badge, and an optional preview chip.
function summaryWithPreview(label, opts) {
  opts = opts || {};
  const badge = opts.adapted ? ' <span class="adapt-badge">Adapted</span>' : '';
  const preview = opts.preview ? `<span class="sum-preview">${esc(namesText(opts.preview))}</span>` : '';
  return `<summary>${label}${badge}${preview}</summary>`;
}

function getLocationName(id) {
  if (source.locations[id]) return source.locations[id].name;
  const ts = source.triggerScenes && source.triggerScenes.find(t => t.id === id);
  if (ts) return ts.name;
  return id;
}

function typeBadge(type) {
  const cls = {
    combat: 'badge-combat', exploration: 'badge-exploration',
    puzzle: 'badge-puzzle', social: 'badge-social',
  }[type] || 'badge-exploration';
  return `<span class="badge ${cls}">${esc(type)}</span>`;
}
</script>
