      if (item.note) h += `<div style="font-size:12px;color:var(--text-dim);margin-top:4px">${esc(item.note)}</div>`;
      h += `</div>`;
    }
    h += `</div></details>`;
  }

  if (hd.consumables && hd.consumables.length) {
    h += `<details><summary>Consumables</summary><div class="section-body">`;
    for (const c of hd.consumables) h += `<div class="treasure-item">${c.count}x ${esc(c.name)}</div>`;
    h += `</div></details>`;
  }

  if (hd.specialItems && hd.specialItems.length) {
    h += `<details><summary>Special Items</summary><div class="section-body">`;
    for (const item of hd.specialItems) {
      h += `<div class="poi-card"><h4>${esc(item.name)}</h4>`;
      if (item.description) h += `<p style="font-size:13px">${esc(item.description)}</p>`;
      if (item.effect) h += `<div style="font-size:13px;color:var(--orange);margin-top:4px">${esc(item.effect)}</div>`;
      h += `</div>`;
    }
    h += `</div></details>`;
  }

  if (hd.mundaneWealth && hd.mundaneWealth.length) {
    h += `<details><summary>Mundane Wealth</summary><div class="section-body">`;
    for (const m of hd.mundaneWealth) h += `<div class="treasure-item">${m.count}x ${esc(m.name)} (${esc(m.value)})</div>`;
    h += `</div></details>`;
  }

  if (hd.coins) {
    h += `<details><summary>Coins</summary><div class="section-body">`;
    h += `<div class="treasure-item">`;
    const parts = [];
    if (hd.coins.pp) parts.push(hd.coins.pp.toLocaleString() + ' pp');
    if (hd.coins.gp) parts.push(hd.coins.gp.toLocaleString() + ' gp');
    if (hd.coins.sp) parts.push(hd.coins.sp.toLocaleString() + ' sp');
    if (hd.coins.cp) parts.push(hd.coins.cp.toLocaleString() + ' cp');
    h += parts.join(' | ');
    h += `</div></div></details>`;
  }
  return h;
}

function renderBestiary() {
  let h = `<div class="room-header"><h1>Bestiary</h1></div>`;
  if (!source.bestiary) return h + '<p>No bestiary data.</p>';
  for (const [id, cr] of Object.entries(source.bestiary)) {
    h += renderStatBlock(cr);
  }
  return h;
}

function renderStatBlock(cr) {
  let h = `<details><summary style="font-size:14px;text-transform:none;letter-spacing:0">${esc(cr.name)} <span style="color:var(--text-dim);font-weight:400;font-size:12px">${esc(cr.cr ? 'CR ' + cr.cr : '')}</span></summary>`;
  h += `<div class="stat-block">`;
  h += `<h3>${esc(cr.name)}</h3>`;
  h += `<div class="stat-sub">${esc(cr.size || '')} ${esc(cr.type || '')}${cr.alignment ? ', ' + esc(cr.alignment) : ''}</div>`;
  h += `<hr class="stat-divider">`;

  if (cr.ac) h += `<div class="stat-row"><span class="stat-label">AC</span> ${cr.ac}${cr.acType ? ' (' + esc(cr.acType) + ')' : ''}</div>`;
  if (cr.hp) h += `<div class="stat-row"><span class="stat-label">HP</span> ${typeof cr.hp === 'string' ? esc(cr.hp) : cr.hp}${cr.hpFormula ? ' (' + esc(cr.hpFormula) + ')' : ''}</div>`;
  if (cr.speed) {
    const spd = Object.entries(cr.speed).filter(([k,v]) => v && k !== 'hover').map(([k,v]) => k === 'walk' ? v + ' ft.' : k + ' ' + v + ' ft.').join(', ');
    h += `<div class="stat-row"><span class="stat-label">Speed</span> ${esc(spd)}${cr.speed.hover ? ' (hover)' : ''}</div>`;
  }

  if (cr.abilities) {
    h += `<hr class="stat-divider">`;
    h += `<div class="ability-scores">`;
    for (const [ab, val] of Object.entries(cr.abilities)) {
      const mod = Math.floor((val - 10) / 2);
      h += `<div><div class="ab-name">${ab}</div><div class="ab-val">${val}</div><div class="ab-mod">(${mod >= 0 ? '+' : ''}${mod})</div></div>`;
    }
    h += `</div>`;
  }

  h += `<hr class="stat-divider">`;
  if (cr.savingThrows) h += `<div class="stat-row"><span class="stat-label">Saves</span> ${Object.entries(cr.savingThrows).map(([k,v]) => k + ' +' + v).join(', ')}</div>`;
  if (cr.skills) h += `<div class="stat-row"><span class="stat-label">Skills</span> ${Object.entries(cr.skills).map(([k,v]) => k + ' +' + v).join(', ')}</div>`;
  if (cr.damageResistances) h += `<div class="stat-row"><span class="stat-label">Resist</span> ${cr.damageResistances.join(', ')}</div>`;
  if (cr.damageImmunities) h += `<div class="stat-row"><span class="stat-label">Immune</span> ${cr.damageImmunities.join(', ')}</div>`;
  if (cr.conditionImmunities) h += `<div class="stat-row"><span class="stat-label">Cond. Immune</span> ${cr.conditionImmunities.join(', ')}</div>`;
  if (cr.senses) h += `<div class="stat-row"><span class="stat-label">Senses</span> ${Object.entries(cr.senses).map(([k,v]) => k.replace(/([A-Z])/g, ' $1').trim() + ' ' + v + (typeof v === 'number' ? ' ft.' : '')).join(', ')}</div>`;
  if (cr.languages) h += `<div class="stat-row"><span class="stat-label">Languages</span> ${cr.languages.join(', ')}</div>`;

  // Traits
  if (cr.traits && cr.traits.length) {
    h += `<hr class="stat-divider">`;
    for (const t of cr.traits) h += `<div class="stat-row"><span class="stat-label">${esc(t.name)}.</span> ${esc(t.description)}</div>`;
  }

  // Actions
  if (cr.actions && cr.actions.length) {
    h += `<hr class="stat-divider"><div style="color:var(--red);font-weight:700;font-size:14px;margin:4px 0">Actions</div>`;
    for (const a of cr.actions) {
      h += `<div class="stat-row"><span class="stat-label">${esc(a.name)}.</span> `;
      if (a.type) h += `<em>${esc(a.type)}:</em> `;
      if (a.toHit) h += `+${a.toHit} to hit, `;
      if (a.reach) h += `reach ${a.reach} ft., `;
      if (a.range) h += `range ${a.range} ft., `;
      if (a.damage) h += `${esc(a.damage)}. `;
      if (a.effect) h += esc(a.effect);
      if (a.description) h += esc(a.description);
      if (a.prerequisite) h += ` <em>(${esc(a.prerequisite)})</em>`;
      if (a.note) h += ` <span class="muted">${esc(a.note)}</span>`;
      h += `</div>`;
    }
  }

  // Bonus Actions
  if (cr.bonusActions && cr.bonusActions.length) {
    h += `<hr class="stat-divider"><div style="color:var(--orange);font-weight:700;font-size:14px;margin:4px 0">Bonus Actions</div>`;
    for (const a of cr.bonusActions) {
      h += `<div class="stat-row"><span class="stat-label">${esc(a.name)}.</span> ${esc(a.description)}</div>`;
    }
  }

  // Reactions
  if (cr.reactions && cr.reactions.length) {
    h += `<hr class="stat-divider"><div style="color:var(--blue);font-weight:700;font-size:14px;margin:4px 0">Reactions</div>`;
    for (const r of cr.reactions) {
      h += `<div class="stat-row"><span class="stat-label">${esc(r.name)}.</span> `;
      if (r.trigger) h += `<em>Trigger: ${esc(r.trigger)}.</em> `;
      h += esc(r.description);
      h += `</div>`;
    }
  }

  // Villain Actions
  if (cr.villainActions && cr.villainActions.length) {
    h += `<hr class="stat-divider"><div style="color:var(--purple);font-weight:700;font-size:14px;margin:4px 0">Villain Actions</div>`;
    for (const a of cr.villainActions) {
      h += `<div class="stat-row"><span class="stat-label">${esc(a.name)}.</span> ${esc(a.description)}</div>`;
    }
  }

  // Spells
  if (cr.spells) {
    h += `<hr class="stat-divider"><div style="color:var(--purple);font-weight:700;font-size:14px;margin:4px 0">Spellcasting</div>`;
    if (cr.spells.saveDC) h += `<div class="stat-row">Spell save DC ${cr.spells.saveDC} (${esc(cr.spells.ability || '')})</div>`;
    if (cr.spells.atWill) h += `<div class="stat-row"><span class="stat-label">At will:</span> ${cr.spells.atWill.join(', ')}</div>`;
    if (cr.spells.perDay3) h += `<div class="stat-row"><span class="stat-label">3/day:</span> ${cr.spells.perDay3.join(', ')}</div>`;
    if (cr.spells.perDay1) h += `<div class="stat-row"><span class="stat-label">1/day:</span> ${cr.spells.perDay1.join(', ')}</div>`;
  }

  // Features (retainer)
  if (cr.features && cr.features.length) {
    h += `<hr class="stat-divider"><div style="color:var(--teal);font-weight:700;font-size:14px;margin:4px 0">Features</div>`;
    for (const f of cr.features) {
      h += `<div class="stat-row"><span class="stat-label">${esc(f.name)} (Lv${f.level}).</span> ${esc(f.description)}</div>`;
    }
  }

  if (cr.note) h += `<div class="dm-note">${esc(cr.note)}</div>`;

  h += `</div></details>`;
  return h;
}

function renderDC() {
  if (!adaptation || !adaptation.dcAdjustments) return '<p>No DC adjustment data.</p>';
  const dc = adaptation.dcAdjustments;
  let h = `<div class="room-header"><h1>DC Adjustments</h1></div>`;
  h += `<div class="kv" style="margin-bottom:12px"><span class="k">Policy:</span> ${esc(dc.policy)}</div>`;
  if (dc.notes) h += `<p style="font-size:13px;color:var(--text-dim);margin-bottom:12px">${esc(dc.notes)}</p>`;
  if (dc.autoSuccesses) {
    h += `<details><summary>Auto-Successes</summary><div class="section-body">`;
    for (const [key, checks] of Object.entries(dc.autoSuccesses)) {
      const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      h += `<div style="margin-bottom:8px"><strong style="color:var(--teal)">${esc(label)}</strong>`;
      h += `<ul class="plain">`;
      for (const c of checks) h += `<li>${esc(c)}</li>`;
      h += `</ul></div>`;
    }
    h += `</div></details>`;
  }
  return h;
}

function renderCallbacks() {
  if (!adaptation || !adaptation.campaignCallbacks) return '<p>No campaign callback data.</p>';
  let h = `<div class="room-header"><h1>Campaign Integration & Callbacks</h1></div>`;
  for (const [key, cb] of Object.entries(adaptation.campaignCallbacks)) {
    h += `<div class="callback-card">`;

function renderVoice() {
  if (!adaptation || !adaptation.narrationVoice) return '<p>No narration voice data.</p>';

// ===================== COMPONENT RENDERERS =====================
function renderConnections(connections, label) {
  if (!connections || !Object.keys(connections).length) return '';
  let h = `<div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">${esc(label)}</div>`;
  h += `<div class="connections">`;
  for (const [targetId, info] of Object.entries(connections)) {
    const targetName = getLocationName(targetId);
    h += `<button class="conn-btn" data-target="${targetId}" style="flex-direction:column;align-items:flex-start;gap:2px">`;
    h += `<div><span class="conn-id">${esc(targetId)}</span> ${esc(targetName)}${info.via ? `<span class="conn-via"> ${esc(info.via)}</span>` : ''}</div>`;
    if (info.note) h += `<div class="conn-note" style="font-size:11px">${esc(info.note)}</div>`;

  }
  h += `</div>`;
  return h;
}

    h += `<div class="check-entry"><span class="check-dc">DC ${enc.detection.dc} ${esc(enc.detection.skill)}</span>: ${esc(enc.detection.result)}</div>`;

// ===================== RIGHT PANEL =====================
function updateRightPanel(view) {
  const panel = document.getElementById('right-panel');
  const main = document.getElementById('main');
  const loc = source && source.locations[view];
  if (!loc || !source.bestiary) {
    panel.classList.remove('visible');
    main.style.marginRight = '';
    return;
  }

  const creatureIds = new Set();
  if (loc.encounters) {
    for (const enc of loc.encounters) {
      if (enc.creatures) for (const c of enc.creatures) {
        if (c.id && source.bestiary[c.id]) creatureIds.add(c.id);
      }
    }
  }
  if (loc.pointsOfInterest) {
    for (const poi of Object.values(loc.pointsOfInterest)) {
      if (poi.creature && source.bestiary[poi.creature]) creatureIds.add(poi.creature);
    }
  }

  if (!creatureIds.size) {
    panel.classList.remove('visible');
    main.style.marginRight = '';
    return;
  }

  let h = `<div class="rp-title">Creatures Here</div>`;
  for (const id of creatureIds) h += renderStatBlockInline(source.bestiary[id]);
  panel.innerHTML = h;
  panel.classList.add('visible');
  main.style.marginRight = '280px';
}

function renderStatBlockInline(cr) {
  let h = `<div class="rp-stat">`;
  h += `<h3>${esc(cr.name)}</h3>`;
  h += `<div class="stat-sub">${esc(cr.size || '')} ${esc(cr.type || '')}${cr.alignment ? ', ' + esc(cr.alignment) : ''}${cr.cr ? ' · CR ' + cr.cr : ''}</div>`;
  h += `<hr class="stat-divider">`;
  if (cr.ac) h += `<div class="stat-row"><span class="stat-label">AC</span> ${cr.ac}${cr.acType ? ' (' + esc(cr.acType) + ')' : ''}</div>`;
  if (cr.hp) h += `<div class="stat-row"><span class="stat-label">HP</span> ${typeof cr.hp === 'string' ? esc(cr.hp) : cr.hp}${cr.hpFormula ? ' (' + esc(cr.hpFormula) + ')' : ''}</div>`;
  if (cr.speed) {
    const spd = Object.entries(cr.speed).filter(([k,v]) => v && k !== 'hover').map(([k,v]) => k === 'walk' ? v + ' ft.' : k + ' ' + v + ' ft.').join(', ');

      const mod = Math.floor((val - 10) / 2);

  if (cr.damageImmunities) h += `<div class="stat-row"><span class="stat-label">Immune</span> ${cr.damageImmunities.join(', ')}</div>`;

  if (cr.senses) h += `<div class="stat-row"><span class="stat-label">Senses</span> ${Object.entries(cr.senses).map(([k,v]) => k.replace(/([A-Z])/g, ' $1').trim() + ' ' + v + (typeof v === 'number' ? ' ft.' : '')).join(', ')}</div>`;
  if (cr.traits && cr.traits.length) {
    h += `<hr class="stat-divider">`;
    for (const t of cr.traits) h += `<div class="stat-row"><span class="stat-label">${esc(t.name)}.</span> ${esc(t.description)}</div>`;
  }
  if (cr.actions && cr.actions.length) {
    h += `<hr class="stat-divider"><div style="color:var(--red);font-weight:700;font-size:12px;margin:3px 0">Actions</div>`;
    for (const a of cr.actions) {
      h += `<div class="stat-row"><span class="stat-label">${esc(a.name)}.</span> `;
      if (a.type) h += `<em>${esc(a.type)}:</em> `;
      if (a.toHit) h += `+${a.toHit} to hit, `;
      if (a.reach) h += `reach ${a.reach} ft., `;
      if (a.damage) h += `${esc(a.damage)}. `;
      if (a.effect) h += esc(a.effect);
      if (a.description) h += esc(a.description);
      h += `</div>`;
    }
  }
  if (cr.bonusActions && cr.bonusActions.length) {
    h += `<hr class="stat-divider"><div style="color:var(--orange);font-weight:700;font-size:12px;margin:3px 0">Bonus Actions</div>`;
    for (const a of cr.bonusActions) h += `<div class="stat-row"><span class="stat-label">${esc(a.name)}.</span> ${esc(a.description)}</div>`;
  }
  if (cr.reactions && cr.reactions.length) {
    h += `<hr class="stat-divider"><div style="color:var(--blue);font-weight:700;font-size:12px;margin:3px 0">Reactions</div>`;
    for (const r of cr.reactions) {
      h += `<div class="stat-row"><span class="stat-label">${esc(r.name)}.</span> `;
      if (r.trigger) h += `<em>Trigger: ${esc(r.trigger)}.</em> `;
      h += esc(r.description) + `</div>`;
    }
  }
  if (cr.villainActions && cr.villainActions.length) {
    h += `<hr class="stat-divider"><div style="color:var(--purple);font-weight:700;font-size:12px;margin:3px 0">Villain Actions</div>`;
    for (const a of cr.villainActions) h += `<div class="stat-row"><span class="stat-label">${esc(a.name)}.</span> ${esc(a.description)}</div>`;
  }
  if (cr.spells) {
    h += `<hr class="stat-divider"><div style="color:var(--purple);font-weight:700;font-size:12px;margin:3px 0">Spellcasting</div>`;

    if (cr.spells.perDay3) h += `<div class="stat-row"><span class="stat-label">3/day:</span> ${cr.spells.perDay3.join(', ')}</div>`;
    if (cr.spells.perDay1) h += `<div class="stat-row"><span class="stat-label">1/day:</span> ${cr.spells.perDay1.join(', ')}</div>`;
  }
  if (cr.note) h += `<div class="stat-row" style="color:var(--orange);margin-top:4px">${esc(cr.note)}</div>`;
  h += `</div>`;
  return h;
}

// ===================== HELPERS =====================
function linkText(str) {
  if (str === null || str === undefined) return '';
  const s = esc(str);
  if (!source || !source.locations) return s;
  const locIds = Object.keys(source.locations);
  const triggerIds = source.triggerScenes ? source.triggerScenes.map(t => t.id) : [];
  const allIds = [...locIds, ...triggerIds];
  if (!allIds.length) return s;
  const pattern = new RegExp(`\\b(${allIds.map(id => id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})\\b`, 'g');
  return s.replace(pattern, id => `<button class="loc-link" onclick="navigate('${id}')">${id}</button>`);
}

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Truncate text for use as a preview snippet in a <summary> chip.
function snip(str, n) {
  if (!str) return '';
  const t = String(str).replace(/\s+/g, ' ').trim();
  return t.length <= n ? t : t.slice(0, n - 1).trimEnd() + '…';
}

// Build a <summary> with a label, optional adapt badge, and an optional preview chip.
function summaryWithPreview(label, opts) {
  opts = opts || {};
  const badge = opts.adapted ? ' <span class="adapt-badge">Adapted</span>' : '';
  const preview = opts.preview ? `<span class="sum-preview">${esc(opts.preview)}</span>` : '';
  return `<summary>${label}${badge}${preview}</summary>`;
}

function getLocationName(id) {
  if (source.locations[id]) return source.locations[id].name;
  const ts = source.triggerScenes && source.triggerScenes.find(t => t.id === id);
  if (ts) return ts.name;
  return id;
}

function typeBadge(type) {
  const cls = {
    combat: 'badge-combat', exploration: 'badge-exploration',
    puzzle: 'badge-puzzle', social: 'badge-social',
  }[type] || 'badge-exploration';
  return `<span class="badge ${cls}">${esc(type)}</span>`;
}
</script>
</body>
