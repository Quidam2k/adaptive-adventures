<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaptive Adventures — DM Dashboard</title>
<script src="adventures/manifest.js"></script>
<!-- Optional: private, unpublished adventures. 404s harmlessly when absent (e.g. a fresh clone). -->
<script src="adventures/manifest.local.js" onerror="this.remove()"></script>
<style>
/* ════════════════════════════════════════════════════════════════════
   PHB / Homebrewery book styling.
   Fonts are copied locally by setup-fonts.ps1 (fonts/ is gitignored);
   every face has a graceful system fallback.
   ════════════════════════════════════════════════════════════════════ */
@font-face { font-family: 'Bookinsanity'; src: url('fonts/Bookinsanity.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Bookinsanity'; src: url('fonts/Bookinsanity Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'Bookinsanity'; src: url('fonts/Bookinsanity Italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'Bookinsanity'; src: url('fonts/Bookinsanity Bold Italic.woff2') format('woff2'); font-weight: 700; font-style: italic; font-display: swap; }
@font-face { font-family: 'Mr Eaves Small Caps'; src: url('fonts/Mr Eaves Small Caps.woff2') format('woff2'); font-weight: 400 800; font-style: normal; font-display: swap; }
@font-face { font-family: 'Scaly Sans'; src: url('fonts/Scaly Sans.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Scaly Sans'; src: url('fonts/Scaly Sans Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'Scaly Sans'; src: url('fonts/Scaly Sans Italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'Scaly Sans'; src: url('fonts/Scaly Sans Bold Italic.woff2') format('woff2'); font-weight: 700; font-style: italic; font-display: swap; }
@font-face { font-family: 'Scaly Sans Caps'; src: url('fonts/Scaly Sans Caps.woff2') format('woff2'); font-weight: 400 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'Nodesto Caps Condensed'; src: url('fonts/Nodesto Caps Condensed Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

:root {
  --font-body: 'Bookinsanity', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --font-heading: 'Mr Eaves Small Caps', 'Palatino Linotype', Georgia, serif;
  --font-sans: 'Scaly Sans', 'Segoe UI', 'Trebuchet MS', sans-serif;
  --font-caps: 'Scaly Sans Caps', 'Scaly Sans', 'Segoe UI', sans-serif;
  --font-title: 'Nodesto Caps Condensed', 'Mr Eaves Small Caps', 'Palatino Linotype', serif;
  --sidebar-w: 230px;
}

/* ── Parchment (default): a page from a published book ─────────────── */
:root, :root[data-theme="parchment"] {
  --bg: #EEE5CE;             /* page parchment */
  --surface: #F6EEDC;        /* quiet card */
  --surface2: #E9DDBE;       /* deeper panel / sidebar */
  --statblock-bg: #FDF1DC;   /* classic tan stat block */
  --readaloud-bg: #FAF7EA;   /* read-aloud cream */
  --border: #D6C7A2;         /* tan hairline */
  --rule: #C9AD6A;           /* gold rule */
  --sb-bar: #E69A28;         /* stat-block orange bars */
  --text: #231A10;           /* ink */
  --text-dim: #7A6C51;       /* faded ink */
  --header: #58180D;         /* red-brown headings */
  --shadow: rgba(80, 60, 20, 0.18);
  --page-hi: rgba(255, 252, 240, 0.55);
  --page-lo: rgba(120, 90, 40, 0.10);

  /* Legacy accent names (used throughout render JS) re-pointed to book ink */
  --gold: #58180D;           /* key labels / emphasis — matches headings */
  --red: #922610;            /* combat / danger / stat-block red */
  --green: #4A6741;          /* success / used */
  --blue: #1D4E89;           /* location links */
  --purple: #5E3A66;         /* questions / villain */
  --orange: #7C4A03;         /* umber — DM notes */
  --teal: #2F5D50;           /* adapted-content marker */
}

/* ── Candlelight: the same book, read by candle. Dimmed parchment, warm
     shadows, identical typography — NOT a generic dark theme. ───────── */
:root[data-theme="candlelight"] {
  --bg: #262019;
  --surface: #2E2719;
  --surface2: #211B12;
  --statblock-bg: #332A18;
  --readaloud-bg: #322B1D;
  --border: #55452B;
  --rule: #8A6D3B;
  --sb-bar: #A9741F;
  --text: #DCCFA8;
  --text-dim: #9A8A64;
  --header: #D07347;
  --shadow: rgba(0, 0, 0, 0.45);
  --page-hi: rgba(255, 220, 150, 0.045);
  --page-lo: rgba(0, 0, 0, 0.35);

  --gold: #D07347;
  --red: #D46A4C;
  --green: #93B27A;
  --blue: #86AFD3;
  --purple: #B491C4;
  --orange: #CF9D53;
  --teal: #82B29A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 120% 80% at 15% 0%, var(--page-hi), transparent 60%),
    radial-gradient(ellipse 100% 90% at 90% 100%, var(--page-lo), transparent 55%);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.5;
  font-size: 15px;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
p { margin: 0 0 0.6em; }
p:last-child { margin-bottom: 0; }

/* ── Loading screen: book cover ────────────────────────────────────── */
#load-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 20px;
  padding: 40px;
}
#load-screen h1 {
  font-family: var(--font-title);
  font-size: 52px;
  font-weight: 700;
  color: var(--header);
  letter-spacing: 2px;
  text-shadow: 0 2px 3px var(--shadow);
}
#load-screen p { color: var(--text-dim); max-width: 480px; text-align: center; }
.load-card {
  background: var(--surface);
  border: 1px solid var(--rule);
  outline: 1px solid var(--border);
  outline-offset: 4px;
  padding: 32px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 400px;
  box-shadow: 0 6px 18px var(--shadow);
}
.load-row { display: flex; flex-direction: column; gap: 6px; }
.load-row label {
  font-family: var(--font-caps);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--header);
}
.load-row select {
  background: var(--readaloud-bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  font-size: 14px;
  font-family: var(--font-sans);
  cursor: pointer;
  width: 100%;
}
.load-row select:focus { outline: none; border-color: var(--header); }
#launch-btn {
  background: var(--header);
  color: var(--statblock-bg);
  border: none;
  padding: 10px 0;
  font-size: 17px;
  font-weight: 700;
  font-family: var(--font-heading);
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s;
  margin-top: 4px;
}
#launch-btn:hover { opacity: 0.85; }
#launch-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#load-error { color: var(--red); font-size: 13px; min-height: 20px; text-align: center; font-family: var(--font-sans); }

/* ── Layout ────────────────────────────────────────────────────────── */
#dashboard { display: none; }
#sidebar {
  position: fixed;
  top: 0; left: 0;
  width: var(--sidebar-w);
  height: 100vh;
  background: var(--surface2);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
  padding: 12px 0;
  z-index: 10;
}
#main {
  margin-left: var(--sidebar-w);
  padding: 28px 36px 60px;
  max-width: 900px;
}

/* ── Sidebar: table of contents ────────────────────────────────────── */
.sb-title {
  font-family: var(--font-heading);
  font-size: 19px;
  font-weight: 700;
  color: var(--header);
  letter-spacing: 1px;
  padding: 8px 16px 2px;
  line-height: 1.15;
}
.sb-divider {
  border: none;
  border-top: 1px solid var(--rule);
  margin: 8px 12px;
}
.sb-item {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: var(--text);
  font-size: 13px;
  font-family: var(--font-sans);
  padding: 4px 16px 4px 20px;
  cursor: pointer;
  transition: background 0.15s;
}
.sb-item:hover { background: var(--surface); }
.sb-item.active { background: var(--surface); color: var(--header); border-left: 3px solid var(--header); padding-left: 17px; font-weight: 700; }
.sb-item .sb-id {
  display: block;
  font-family: var(--font-caps);
  font-weight: 700;
  color: var(--text-dim);
  font-size: 10px;
  letter-spacing: 0.5px;
  line-height: 1.2;
}
.sb-item .sb-name {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.3;
}
.sb-item.active .sb-id { color: var(--header); }
.sb-section {
  font-family: var(--font-caps);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--header);
  padding: 10px 16px 2px;
}
#theme-toggle-btn, #play-toggle-btn {
  display: block;
  width: calc(100% - 24px);
  margin: 8px 12px;
  background: none;
  border: 1px solid var(--rule);
  color: var(--text-dim);
  font-family: var(--font-caps);
  font-size: 11px;
  padding: 6px 10px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: border-color 0.15s, color 0.15s;
}
#theme-toggle-btn:hover, #play-toggle-btn:hover { border-color: var(--header); color: var(--header); }
#play-toggle-btn.on { border-color: var(--header); color: var(--header); font-weight: 700; }

/* ── Page headers ──────────────────────────────────────────────────── */
.room-header { margin-bottom: 18px; border-bottom: 2px solid var(--rule); padding-bottom: 8px; }
.room-header h1 {
  font-family: var(--font-heading);
  font-size: 34px;
  font-weight: 700;
  color: var(--header);
  line-height: 1.1;
  margin-bottom: 2px;
}
.room-header .room-meta {
  font-family: var(--font-sans);
  font-size: 13.5px;
  color: var(--text-dim);
}

/* ── Connections ───────────────────────────────────────────────────── */
.connections { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; }
.conn-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 6px 12px;
  color: var(--text);
  font-size: 12.5px;
  cursor: pointer;
  font-family: var(--font-sans);
  box-shadow: 0 1px 2px var(--shadow);
  transition: border-color 0.15s;
}
.conn-btn:hover { border-color: var(--header); }
.conn-btn .conn-id { font-family: var(--font-caps); font-weight: 700; color: var(--header); }
.conn-btn .conn-via { color: var(--text-dim); font-size: 11px; }
.conn-note { font-size: 11px; color: var(--orange); margin-top: 2px; font-family: var(--font-sans); }

/* ── Collapsible sections: book section heads ──────────────────────── */
details { margin-bottom: 14px; }
summary {
  font-family: var(--font-heading);
  font-size: 21px;
  font-weight: 700;
  color: var(--header);
  cursor: pointer;
  padding: 4px 0 2px;
  border-bottom: 1px solid var(--rule);
  list-style: none;
  user-select: none;
  line-height: 1.2;
}
summary::-webkit-details-marker { display: none; }
summary::before {
  content: '\25B8';
  display: inline-block;
  margin-right: 7px;
  font-size: 13px;
  color: var(--rule);
  transition: transform 0.2s;
  vertical-align: 2px;
}
details[open] > summary::before { transform: rotate(90deg); }
details[open] > summary { border-bottom: 2px solid var(--rule); }
.section-body { padding: 10px 0 4px; }

/* Collapsed-section preview chip */
.sum-preview {
  display: inline;
  margin-left: 10px;
  font-family: var(--font-body);
  font-size: 12.5px;
  font-weight: 400;
  color: var(--text-dim);
  font-style: italic;
  text-transform: none;
  letter-spacing: 0;
  vertical-align: 2px;
}
details[open] > summary .sum-preview { display: none; }

/* Small run-in labels inside sections (was inline-styled uppercase divs) */
.sub-label {
  font-family: var(--font-caps);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.pr-block-title, .cb-sub-title {
  font-family: var(--font-caps);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.pr-block-title { margin-bottom: 4px; }
.cb-sub-title { color: var(--header); margin-top: 8px; }

/* ════════════════════════════════════════════════════════════════════
   PATTERN 1 — READ-ALOUD: the boxed descriptive text of a printed page
   ════════════════════════════════════════════════════════════════════ */
.read-aloud {
  background: var(--readaloud-bg);
  border-top: 2px solid var(--text);
  border-bottom: 2px solid var(--text);
  padding: 12px 18px;
  margin: 10px 0;
  font-family: var(--font-body);
  font-size: 15.5px;
  line-height: 1.6;
  box-shadow: 1px 3px 6px var(--shadow);
}
.taunt-msg { font-style: italic; font-size: 15px; margin: 6px 0; }

/* ════════════════════════════════════════════════════════════════════
   PATTERN 2 — DM-ONLY: red-brown frame + generated small-caps flag
   ════════════════════════════════════════════════════════════════════ */
.secret, .tactical-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--header);
  padding: 8px 12px;
  margin: 8px 0;
  font-size: 14px;
  box-shadow: 0 1px 2px var(--shadow);
}
.secret::before, .tactical-card::before {
  content: 'DM only';
  display: block;
  font-family: var(--font-caps);
  font-size: 10px;
  font-weight: 700;
  color: var(--header);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 2px;
}
.secret-label {
  font-family: var(--font-caps);
  color: var(--header);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 2px;
}
.tactical-card h4 { font-family: var(--font-heading); color: var(--header); font-size: 17px; margin-bottom: 2px; }
.tactical-card p { font-size: 14px; }
.dm-note {
  font-family: var(--font-sans);
  font-size: 12.5px;
  color: var(--orange);
  margin-top: 4px;
  padding-top: 4px;
  border-top: 1px solid var(--border);
}
.sr-dm-note { font-family: var(--font-sans); font-size: 12.5px; color: var(--orange); margin-top: 4px; border-top: 1px solid var(--border); padding-top: 4px; }
.callback-dm-note { font-family: var(--font-sans); font-size: 12.5px; color: var(--orange); margin-top: 6px; border-top: 1px solid var(--border); padding-top: 6px; }

/* ════════════════════════════════════════════════════════════════════
   PATTERN 3 — ROLLABLE / CHECK: Scaly Sans, DC prominent
   ════════════════════════════════════════════════════════════════════ */
.check-entry {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 6px 10px;
  margin: 4px 0;
  font-family: var(--font-sans);
  font-size: 13.5px;
}
.check-dc { font-family: var(--font-caps); font-weight: 700; color: var(--header); }

/* ════════════════════════════════════════════════════════════════════
   PATTERN 4 — REFERENCE: quiet parchment cards, small-caps name line.
   Semantic meaning carried by the label color, not 20 card treatments.
   ════════════════════════════════════════════════════════════════════ */
.encounter-card, .poi-card, .hazard-card, .sr-card, .ita-item,
.taunt-card, .callback-card, .voice-card, .pr-item,
.cb-hazard, .cb-creature, .cb-synergy, .cb-ambig, .treasure-item {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 10px 14px;
  margin: 8px 0;
  box-shadow: 0 1px 2px var(--shadow);
}
.encounter-card h4, .poi-card h4, .hazard-card h4, .callback-card h4,
.cb-hazard h4, .cb-creature h4 {
  font-family: var(--font-heading);
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 3px;
  line-height: 1.15;
}
.encounter-card h4, .cb-creature h4 { color: var(--red); }
.hazard-card h4, .cb-hazard h4 { color: var(--orange); }
.poi-card h4 { color: var(--header); }
.callback-card h4 { color: var(--header); }

.creature-list { list-style: none; padding: 0; font-family: var(--font-sans); }
.creature-list li { font-size: 13.5px; padding: 2px 0; }
.creature-list li::before { content: '\2694'; margin-right: 6px; color: var(--red); }
.tactics { font-size: 14px; color: var(--text-dim); margin-top: 6px; font-style: italic; }
.poi-type {
  font-family: var(--font-caps);
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

.ita-item { border-left: 3px solid var(--purple); }
.ita-q { font-weight: 700; color: var(--purple); font-size: 14.5px; margin-bottom: 4px; font-style: italic; }
.ita-a { font-size: 14px; }
.ita-thread { font-family: var(--font-sans); font-size: 11.5px; color: var(--teal); margin-top: 4px; }

.sr-card { border-left: 3px solid var(--teal); }
.sr-pc { font-family: var(--font-heading); font-weight: 700; color: var(--teal); font-size: 17px; }
.sr-cap { font-family: var(--font-caps); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 6px; }
.sr-moment { font-size: 14px; margin-bottom: 4px; }
.sr-hook { font-size: 13.5px; color: var(--header); font-style: italic; }

.treasure-item { border-left: 3px solid var(--rule); font-size: 14px; }

.taunt-card { border-left: 3px solid var(--purple); }
.taunt-trigger { font-family: var(--font-caps); font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
.taunt-target { font-family: var(--font-sans); font-size: 12px; color: var(--teal); margin-bottom: 4px; }
.taunt-note { font-family: var(--font-sans); font-size: 12.5px; color: var(--orange); }

.callback-option {
  background: var(--readaloud-bg);
  border: 1px solid var(--border);
  padding: 8px 10px;
  margin: 6px 0;
  font-size: 13.5px;
}
.callback-option strong { color: var(--teal); }

.voice-card { border-left: 3px solid var(--blue); padding: 8px 12px; margin: 6px 0; }
.voice-card .voice-name { font-family: var(--font-heading); font-weight: 700; color: var(--header); font-size: 16px; }
.voice-card .voice-desc { font-size: 14px; font-style: italic; }

.pr-item { border-left: 3px solid var(--blue); padding: 8px 28px 8px 12px; margin: 4px 0; font-size: 14px; }
.pr-threshold { font-family: var(--font-caps); font-weight: 700; color: var(--blue); font-size: 12px; }
.pr-reveals { margin-top: 2px; }
.pr-pc-name { font-family: var(--font-caps); font-weight: 700; color: var(--teal); font-size: 12px; }
.pr-block { margin: 10px 0; }

.cb-hazard { border-left: 3px solid var(--orange); padding-right: 28px; }
.cb-hazard .cb-detail { font-size: 14px; }
.cb-hazard .cb-impact { font-size: 13px; color: var(--text-dim); margin-top: 4px; font-style: italic; }
.cb-creature { border-top: 2px solid var(--red); margin: 10px 0 6px; }
.cb-creature .cb-stats { font-family: var(--font-sans); font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
.cb-creature .cb-impact { font-size: 13px; color: var(--text-dim); margin-top: 4px; font-style: italic; }
.cb-creature ul.plain li { font-size: 13px; padding: 2px 0; }
.cb-ambig { border-left: 3px solid var(--purple); padding: 6px 28px 6px 10px; margin: 4px 0; font-size: 13px; }
.cb-synergy { border-left: 3px solid var(--teal); padding: 8px 28px 8px 12px; margin: 6px 0; font-size: 13.5px; }

/* ── Stat blocks: the classic tan PHB monster block ────────────────── */
.stat-block {
  background: var(--statblock-bg);
  border-top: 4px solid var(--sb-bar);
  border-bottom: 4px solid var(--sb-bar);
  outline: 1px solid var(--text);
  outline-offset: -5px;
  padding: 14px 18px;
  margin: 10px 0;
  font-family: var(--font-sans);
  box-shadow: 1px 3px 8px var(--shadow);
}
.stat-block h3 {
  font-family: var(--font-heading);
  color: var(--header);
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 0;
  line-height: 1.1;
}
.stat-block .stat-sub, .rp-stat .stat-sub { font-size: 12px; color: var(--text-dim); font-style: italic; margin-bottom: 6px; }
.stat-row { font-size: 13.5px; padding: 2px 0; }
.stat-label { font-weight: 700; color: var(--header); }
.stat-sec {
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 18px;
  color: var(--header);
  border-bottom: 1px solid var(--header);
  margin: 6px 0 4px;
}
.ability-scores { display: flex; gap: 12px; margin: 8px 0; text-align: center; }
.ability-scores div { flex: 1; }
.ability-scores .ab-name { font-family: var(--font-caps); font-size: 11px; font-weight: 700; color: var(--header); }
.ability-scores .ab-val { font-size: 15px; font-weight: 700; }
.ability-scores .ab-mod { font-size: 12px; color: var(--text-dim); }
.stat-divider {
  border: none;
  height: 3px;
  margin: 7px 0;
  background: linear-gradient(to right, var(--red) 0%, var(--red) 60%, transparent 100%);
  clip-path: polygon(0 0, 100% 50%, 0 100%);
}
.stat-summary { font-size: 17px; }
.stat-cr { font-family: var(--font-sans); color: var(--text-dim); font-weight: 400; font-size: 12.5px; }

/* ── General helpers ───────────────────────────────────────────────── */
.kv { font-size: 14px; padding: 2px 0; }
.kv .k { font-weight: 700; color: var(--header); }
.muted { color: var(--text-dim); }
.badge {
  display: inline-block;
  font-family: var(--font-caps);
  padding: 1px 7px;
  border: 1px solid currentColor;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  vertical-align: 1px;
}
.badge-combat { color: var(--red); }
.badge-exploration { color: var(--blue); }
.badge-puzzle { color: var(--purple); }
.badge-social { color: var(--green); }
.badge-safe { color: var(--green); font-size: 9px; margin-left: 6px; }
ul.plain { list-style: none; padding: 0; }
ul.plain li { padding: 3px 0; font-size: 14px; }
ul.plain li::before { content: '\2022'; margin-right: 8px; color: var(--rule); }

/* Location links in narrative text */
.loc-link {
  display: inline;
  background: none;
  border: none;
  padding: 0 1px;
  color: var(--blue);
  font-size: inherit;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 2px;
}
.loc-link:hover { color: var(--header); text-decoration-style: solid; }

/* Adaptation badge */
.adapt-badge {
  display: inline-block;
  font-family: var(--font-caps);
  padding: 1px 7px;
  border: 1px solid var(--teal);
  border-radius: 8px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--teal);
  margin-left: 8px;
  vertical-align: 3px;
}
.sb-adapt { font-size: 10px; color: var(--teal); margin-left: 6px; vertical-align: middle; }

/* ── Right panel ───────────────────────────────────────────────────── */
#right-panel {
  position: fixed;
  top: 0; right: 0;
  width: 280px;
  height: 100vh;
  background: var(--statblock-bg);
  border-left: 1px solid var(--rule);
  overflow-y: auto;
  z-index: 10;
  display: none;
}
#right-panel.visible { display: block; }
.rp-title {
  font-family: var(--font-caps);
  font-size: 11px;
  font-weight: 700;
  color: var(--header);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 12px 16px 8px;
  border-bottom: 2px solid var(--sb-bar);
  position: sticky;
  top: 0;
  background: var(--statblock-bg);
  z-index: 1;
}
.rp-stat { padding: 12px 14px; border-bottom: 2px solid var(--sb-bar); font-family: var(--font-sans); }
.rp-stat h3 { font-family: var(--font-heading); color: var(--header); font-size: 18px; font-weight: 700; margin-bottom: 1px; line-height: 1.1; }
.rp-stat .stat-row { font-size: 12px; padding: 2px 0; }
.rp-stat .stat-sec { font-size: 15px; margin: 4px 0 3px; }
.rp-stat .ability-scores { display: flex; gap: 4px; margin: 6px 0; text-align: center; }
.rp-stat .ability-scores div { flex: 1; }
.rp-stat .ability-scores .ab-name { font-size: 9px; }
.rp-stat .ability-scores .ab-val { font-size: 13px; font-weight: 700; }
.rp-stat .ability-scores .ab-mod { font-size: 10px; }
.rp-stat .stat-divider { height: 2px; margin: 5px 0; }

/* ── Scrollbar ─────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 9px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* ── Mark-as-used (tuned for parchment: fade to pencil-check) ──────── */
.markable {
  position: relative;
  cursor: pointer;
  transition: opacity 0.15s, filter 0.15s;
}
.markable:hover::after {
  content: '\2713';
  position: absolute;
  top: 6px; right: 8px;
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 700;
  opacity: 0.45;
  pointer-events: none;
}
.markable.marked {
  opacity: 0.55;
  filter: grayscale(0.5) sepia(0.15);
  text-decoration: line-through;
  text-decoration-color: var(--green);
  text-decoration-thickness: 1px;
}
.markable.marked::after {
  content: '\2713 used';
  position: absolute;
  top: 6px; right: 8px;
  background: var(--green);
  color: var(--statblock-bg);
  font-family: var(--font-caps);
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 8px;
  text-decoration: none;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  opacity: 1;
  pointer-events: none;
}
.markable.marked:hover::after {
  content: '\2713 used \2022 click to unmark';
  opacity: 1;
}
.markable .loc-link { position: relative; z-index: 2; }

/* ── Scene divider (WBtW linked scenes) ────────────────────────────── */
.scene-divider {
  border-top: 2px solid var(--rule);
  margin: 22px 0 10px;
  padding-top: 10px;
  font-family: var(--font-heading);
  font-size: 20px;
  font-weight: 700;
  color: var(--header);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── Continuity briefing (top of scene view) ───────────────────────── */
.continuity-briefing {
  background: var(--readaloud-bg);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--header);
  padding: 12px 16px;
  margin-bottom: 16px;
  font-size: 14px;
  box-shadow: 0 1px 3px var(--shadow);
}
.continuity-briefing h3 { font-family: var(--font-heading); color: var(--header); font-size: 17px; margin-bottom: 6px; }
.continuity-briefing .cb-kv { margin: 4px 0; }
.continuity-briefing .cb-kv .k { font-weight: 700; color: var(--header); }

/* ── Clear-marks button ────────────────────────────────────────────── */
#clear-marks-btn {
  display: block;
  width: calc(100% - 24px);
  margin: 8px 12px 4px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font-caps);
  font-size: 11px;
  padding: 6px 10px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: border-color 0.15s, color 0.15s;
}
#clear-marks-btn:hover { border-color: var(--red); color: var(--red); }
#clear-marks-btn.empty { opacity: 0.4; cursor: default; }
#clear-marks-btn.empty:hover { border-color: var(--border); color: var(--text-dim); }

/* ── Play mode: declutter location/scene views at the table ────────────
   Renderers stamp data-play="keep" on sections that matter mid-session
   (read-aloud, encounters, briefings, …). Everything unstamped hides.
   Reference pages (#main[data-view-kind="ref"]) are never filtered.  ── */
body[data-play-mode="on"] #main[data-view-kind="location"] details:not([data-play="keep"]),
body[data-play-mode="on"] #main[data-view-kind="scene"] details:not([data-play="keep"]) { display: none; }
body[data-play-mode="on"] #main[data-view-kind="location"] .read-aloud,
body[data-play-mode="on"] #main[data-view-kind="scene"] .read-aloud { font-size: 18px; line-height: 1.65; }

/* ── Command palette (Ctrl+K) ──────────────────────────────────────── */
#palette-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(25, 15, 5, 0.45);
  z-index: 100;
  display: none;
}
#palette-backdrop.open { display: block; }
#palette {
  position: fixed;
  top: 12vh;
  left: 50%;
  transform: translateX(-50%);
  width: min(560px, 90vw);
  background: var(--surface);
  border: 1px solid var(--rule);
  outline: 1px solid var(--border);
  outline-offset: 3px;
  box-shadow: 0 10px 30px var(--shadow);
}
#palette-input {
  width: 100%;
  background: var(--readaloud-bg);
  border: none;
  border-bottom: 2px solid var(--rule);
  padding: 12px 16px;
  font-family: var(--font-sans);
  font-size: 16px;
  color: var(--text);
}
#palette-input:focus { outline: none; }
#palette-results {
  list-style: none;
  margin: 0;
  padding: 4px 0;
  max-height: 50vh;
  overflow-y: auto;
}
#palette-results li {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 7px 16px;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 14px;
}
#palette-results li.sel { background: var(--surface2); box-shadow: inset 3px 0 0 var(--header); }
#palette-results li:hover { background: var(--surface2); }
.pal-kind {
  font-family: var(--font-caps);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--header);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 6px;
  flex-shrink: 0;
}
.pal-label { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-parent { color: var(--text-dim); font-size: 12px; margin-left: auto; flex-shrink: 0; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-empty { padding: 10px 16px; color: var(--text-dim); font-style: italic; font-size: 13px; font-family: var(--font-sans); }
</style>
</head>
<body>

<!-- ==================== LOAD SCREEN ==================== -->
<div id="load-screen">
  <h1>Adaptive Adventures</h1>
  <div class="load-card">
    <div class="load-row">
      <label for="adventureSelect">Adventure</label>
      <select id="adventureSelect" onchange="onAdventureChange()">
        <option value="">— Select adventure —</option>
      </select>
    </div>
    <div class="load-row">
      <label for="adaptationSelect">Party Adaptation</label>
      <select id="adaptationSelect">
        <option value="">— None (generic) —</option>
      </select>
    </div>
    <button id="launch-btn" disabled onclick="launchSelected()">Launch</button>
  </div>
  <div id="load-error"></div>
</div>

<!-- ==================== DASHBOARD ==================== -->
<div id="dashboard">
  <nav id="sidebar"></nav>
  <div id="main"></div>
  <div id="right-panel"></div>
</div>

<script>
// ===================== STATE =====================
let source = null;
let adaptation = null;
let currentView = null;
let currentAdventureId = null;
let currentAdaptationId = null;
let marks = {}; // { markKey: true }

// ===================== THEME =====================
const THEME_KEY = 'aa-theme';
function currentTheme() {
  return document.documentElement.dataset.theme === 'candlelight' ? 'candlelight' : 'parchment';
}
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  updateThemeButton();
}
function toggleTheme() { applyTheme(currentTheme() === 'candlelight' ? 'parchment' : 'candlelight'); }
function updateThemeButton() {
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = currentTheme() === 'candlelight' ? 'Parchment' : 'Candlelight';
}
(function () {
  let t = 'parchment';
  try { t = localStorage.getItem(THEME_KEY) || 'parchment'; } catch (e) {}
  document.documentElement.dataset.theme = t;
})();

// ===================== PLAY / PREP MODE =====================
// Play mode declutters location/scene views to what matters at the table.
// Hiding is pure CSS keyed off body[data-play-mode] + data-play="keep" stamps
// applied at render time (see PLAY_KEEP uses in the renderers).
let playMode = false;
const PLAY_KEEP = ' data-play="keep"';
function playModeKey() {
  return `aa-playmode:${currentAdventureId || 'unknown'}:${currentAdaptationId || 'none'}`;
}
function loadPlayMode() {
  try { playMode = localStorage.getItem(playModeKey()) === 'on'; } catch (e) { playMode = false; }
  applyPlayMode();
}
function applyPlayMode() {
  document.body.dataset.playMode = playMode ? 'on' : 'off';
  updatePlayModeButton();
}
function togglePlayMode() {
  playMode = !playMode;
  try { localStorage.setItem(playModeKey(), playMode ? 'on' : 'off'); } catch (e) {}
  applyPlayMode();
  if (currentView) navigate(currentView);
}
function updatePlayModeButton() {
  const btn = document.getElementById('play-toggle-btn');
  if (!btn) return;
  btn.textContent = playMode ? 'Prep Mode' : 'Play Mode';
  btn.classList.toggle('on', playMode);
}

// ===================== MARK-AS-USED =====================
function marksStorageKey() {
  const advId = currentAdventureId || 'unknown';
  const adaptId = currentAdaptationId || 'none';
  return `aa-marks:${advId}:${adaptId}`;
}
function loadMarks() {
  try {
    const raw = localStorage.getItem(marksStorageKey());
    marks = raw ? JSON.parse(raw) : {};
  } catch (e) {
    marks = {};
  }
}
function saveMarks() {
  try { localStorage.setItem(marksStorageKey(), JSON.stringify(marks)); } catch (e) {}
}
function isMarked(key) { return !!marks[key]; }
function toggleMark(key) {
  if (marks[key]) delete marks[key];
  else marks[key] = true;
  saveMarks();
  updateClearMarksButton();
}
function applyMarks(root) {
  root = root || document.getElementById('main');
  if (!root) return;
  root.querySelectorAll('[data-mark-key]').forEach(el => {
    el.classList.toggle('marked', isMarked(el.dataset.markKey));
  });
}
function clearAllMarks() {
  if (!Object.keys(marks).length) return;
  if (!confirm('Clear all marks for this adaptation?')) return;
  marks = {};
  saveMarks();
  applyMarks();
  updateClearMarksButton();
}
function updateClearMarksButton() {
  const btn = document.getElementById('clear-marks-btn');
  if (!btn) return;
  const n = Object.keys(marks).length;
  if (n === 0) {
    btn.textContent = 'No marks';
    btn.classList.add('empty');
  } else {
    btn.textContent = `Clear ${n} Mark${n === 1 ? '' : 's'}`;
    btn.classList.remove('empty');
  }
}
// Delegated click handler for markable items
document.addEventListener('click', (e) => {
  // Don't trigger if click was on a loc-link or button inside a markable
  if (e.target.closest('.loc-link') || e.target.closest('.conn-btn') || e.target.closest('.sb-item')) return;
  if (e.target.closest('#clear-marks-btn')) return;
  const markable = e.target.closest('.markable[data-mark-key]');
  if (!markable) return;
  // Also ignore clicks on summary/details toggles inside a markable (none expected, but safe)
  if (e.target.tagName === 'SUMMARY') return;
  const key = markable.dataset.markKey;
  toggleMark(key);
  markable.classList.toggle('marked', isMarked(key));
});

// ===================== MANIFEST / DROPDOWN =====================
function populateDropdowns() {
  const advSel = document.getElementById('adventureSelect');
  const manifest = window.ADVENTURES_MANIFEST || [];
  for (const adv of manifest) {
    const opt = document.createElement('option');
    opt.value = adv.id;
    opt.textContent = adv.title + (adv.subtitle ? ' — ' + adv.subtitle : '');
    advSel.appendChild(opt);
  }
  if (manifest.length === 1) {
    advSel.value = manifest[0].id;
    onAdventureChange();
  }
}

function onAdventureChange() {
  const advId = document.getElementById('adventureSelect').value;
  const adaptSel = document.getElementById('adaptationSelect');
  adaptSel.innerHTML = '<option value="">— None (generic) —</option>';
  const launchBtn = document.getElementById('launch-btn');
  if (!advId) { launchBtn.disabled = true; return; }
  const manifest = window.ADVENTURES_MANIFEST || [];
  const adv = manifest.find(a => a.id === advId);
  if (adv && adv.adaptations) {
    for (const a of adv.adaptations) {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.label;
      adaptSel.appendChild(opt);
    }
    if (adv.adaptations.length === 1) adaptSel.value = adv.adaptations[0].id;
  }
  launchBtn.disabled = false;
}

function launchSelected() {
  const advId = document.getElementById('adventureSelect').value;
  const adaptId = document.getElementById('adaptationSelect').value;
  const loadError = document.getElementById('load-error');
  loadError.textContent = '';
  const manifest = window.ADVENTURES_MANIFEST || [];
  const adv = manifest.find(a => a.id === advId);
  if (!adv) { loadError.textContent = 'Adventure not found.'; return; }
  currentAdventureId = advId;
  currentAdaptationId = adaptId || null;
  loadMarks();

  function loadAdaptation() {
    if (!adaptId) { launchDashboard(); return; }
    const adaptMeta = adv.adaptations.find(a => a.id === adaptId);
    if (!adaptMeta) { launchDashboard(); return; }
    const old = document.getElementById('adaptationScript');
    if (old) old.remove();
    document.querySelectorAll('.adaptation-script').forEach(el => el.remove());
    if (adaptMeta.files && adaptMeta.files.length) {
      // Split adaptation: party / state / rulings layers, loaded in order and
      // merged. Each file assigns its own global; merge happens after the last.
      window.ADVENTURE_ADAPTATION_PARTY = null;
      window.ADVENTURE_ADAPTATION_STATE = null;
      window.ADVENTURE_ADAPTATION_RULINGS = null;
      const queue = adaptMeta.files.slice();
      const next = () => {
        if (!queue.length) {
          adaptation = mergeAdaptationParts(window.ADVENTURE_ADAPTATION_PARTY,
            window.ADVENTURE_ADAPTATION_STATE, window.ADVENTURE_ADAPTATION_RULINGS);
          launchDashboard();
          return;
        }
        const file = queue.shift();
        const s = document.createElement('script');
        s.className = 'adaptation-script';
        s.src = file + '?v=' + Date.now();
        s.onload = next;
        s.onerror = () => { loadError.textContent = 'Failed to load adaptation file: ' + file; };
        document.head.appendChild(s);
      };
      next();
      return;
    }
    window.ADVENTURE_ADAPTATION = null;
    const s = document.createElement('script');
    s.className = 'adaptation-script';
    s.src = adaptMeta.file + '?v=' + Date.now();
    s.onload = () => { adaptation = window.ADVENTURE_ADAPTATION; launchDashboard(); };
    s.onerror = () => { loadError.textContent = 'Failed to load adaptation file.'; };
    document.head.appendChild(s);
  }

  const old = document.getElementById('sourceScript');
  if (old) old.remove();
  window.ADVENTURE_SOURCE = null;
  const s = document.createElement('script');
  s.id = 'sourceScript';
  s.src = adv.source + '?v=' + Date.now();
  s.onload = () => { source = window.ADVENTURE_SOURCE; loadAdaptation(); };
  s.onerror = () => { loadError.textContent = 'Failed to load adventure source file.'; };
  document.head.appendChild(s);
}

// Deep-merge the split adaptation layers (party / state / rulings) into the
// single adaptation object the renderers expect. Top level is a shallow merge
// (state wins); scenes merge per-scene with state's keys spread over party's;
// the rulings log attaches as adaptation.rulings.
function mergeAdaptationParts(party, state, rulings) {
  const merged = {};
  for (const part of [party, state]) {
    if (!part) continue;
    for (const [k, v] of Object.entries(part)) {
      if (k === 'scenes') continue;
      merged[k] = v;
    }
  }
  const scenes = {};
  for (const part of [party, state]) {
    if (!part || !part.scenes) continue;
    for (const [id, sc] of Object.entries(part.scenes)) {
      scenes[id] = Object.assign(scenes[id] || {}, sc);
    }
  }
  if (Object.keys(scenes).length) merged.scenes = scenes;
  if (rulings && rulings.rulings && rulings.rulings.length) merged.rulings = rulings.rulings;
  return merged;
}

// ===================== LAUNCH =====================
function launchDashboard() {
  document.getElementById('load-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadPlayMode();
  buildSidebar();
  buildSearchIndex();
  const defaultView = (adaptation && adaptation.continuityBriefing)
    ? 'ref-pickup'
    : Object.keys(source.locations)[0];
  navigate(defaultView);
}

function returnToMenu() {
  closePalette();
  source = null;
  adaptation = null;
  currentView = null;
  const panel = document.getElementById('right-panel');
  panel.classList.remove('visible');
  document.getElementById('main').style.marginRight = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('load-screen').style.display = 'flex';
  document.getElementById('load-error').textContent = '';
}

// Init dropdowns on load
populateDropdowns();

// ===================== SIDEBAR =====================
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  let html = `<div class="sb-title">${esc(source.meta.title)}</div>`;
  if (adaptation) {
    html += `<div style="font-size:11px;color:var(--teal);padding:2px 16px 6px">${esc(adaptation.campaign)} adaptation</div>`;
  } else {
    html += `<div style="font-size:11px;color:var(--text-dim);padding:2px 16px 6px">Generic (no adaptation)</div>`;
  }
  html += `<button class="sb-item" style="color:var(--text-dim);font-size:11px;padding:4px 16px 8px" onclick="returnToMenu()">← Change Adventure</button>`;
  if (adaptation && adaptation.continuityBriefing) {
    html += `<div class="sb-section">Tonight</div>`;
    html += `<button class="sb-item" data-view="ref-pickup"><span class="sb-name">Tonight <span class="sb-adapt">✦</span></span></button>`;
  }
  html += `<div class="sb-section">Locations</div>`;
  for (const [id, loc] of Object.entries(source.locations)) {
    html += `<button class="sb-item" data-view="${id}"><span class="sb-id">${id}</span><span class="sb-name">${esc(loc.name)}</span></button>`;
  }
  if (source.triggerScenes && source.triggerScenes.length) {
    html += `<hr class="sb-divider">`;
    html += `<div class="sb-section">Events</div>`;
    for (const ts of source.triggerScenes) {
      html += `<button class="sb-item" data-view="${ts.id}"><span class="sb-id">&varr;</span><span class="sb-name">${esc(ts.name)}</span></button>`;
    }
  }
  html += `<hr class="sb-divider">`;
  html += `<div class="sb-section">Reference</div>`;
  for (const [id, label, isAdapted] of referencePages()) {
    html += `<button class="sb-item" data-view="${id}"><span class="sb-name">${esc(label)}${isAdapted ? '<span class="sb-adapt">✦</span>' : ''}</span></button>`;
  }
  if (adaptation) {
    html += `<hr class="sb-divider">`;
    html += `<div class="sb-section">Session</div>`;
    html += `<button id="clear-marks-btn" onclick="clearAllMarks()">No marks</button>`;
  }
  html += `<hr class="sb-divider">`;
  html += `<button id="play-toggle-btn" onclick="togglePlayMode()"></button>`;
  html += `<button id="theme-toggle-btn" onclick="toggleTheme()"></button>`;
  sb.innerHTML = html;
  sb.querySelectorAll('.sb-item').forEach(btn => {
    btn.addEventListener('click', () => navigate(btn.dataset.view));
  });
  updateClearMarksButton();
  updateThemeButton();
  updatePlayModeButton();
}

// Reference pages available for the current source/adaptation, as
// [viewId, label, isAdapted]. Shared by the sidebar and the search index.
function referencePages() {
  const refs = [
    source.lore                  && ['ref-lore',      'Lore & Hooks',       false],
    source.commonFeatures        && ['ref-features',  'Common Features',    false],
    source.undeadBehavior        && ['ref-undead',    'Undead Behavior',    false],
    source.rhodarTelepathy       && ['ref-telepathy', "Rhodar's Telepathy", false],
    source.hoard                 && ['ref-hoard',     'Treasure Hoard',     false],
    source.bestiary              && ['ref-bestiary',  'Bestiary',           false],
  ].filter(Boolean);
  if (adaptation) {
    refs.push(['ref-dc', 'DC Adjustments', true]);
    refs.push(['ref-callbacks', 'Campaign Integration', true]);
    refs.push(['ref-voice', 'Narration Voice', true]);
    if (adaptation.rulings && adaptation.rulings.length) refs.push(['ref-rulings', 'Rulings Log', true]);
  }
  return refs;
}

function navigate(view) {
  currentView = view;
  // Update sidebar active
  document.querySelectorAll('.sb-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  // Render (+ stamp the view kind so play-mode CSS only filters location/scene views)
  const main = document.getElementById('main');
  if (source.locations[view]) {
    main.dataset.viewKind = 'location';
    main.innerHTML = renderLocation(view);
  } else if (source.triggerScenes && source.triggerScenes.find(t => t.id === view)) {
    main.dataset.viewKind = 'scene';
    main.innerHTML = renderTriggerScene(view);
  } else if (view.startsWith('ref-')) {
    main.dataset.viewKind = 'ref';
    main.innerHTML = renderReference(view);
  }
  main.scrollTop = 0;
  window.scrollTo(0, 0);
  updateRightPanel(view);
  // Wire up connection buttons
  main.querySelectorAll('.conn-btn').forEach(btn => {
    btn.addEventListener('click', () => navigate(btn.dataset.target));
  });
  applyMarks(main);
}
